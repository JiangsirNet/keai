<!-- 行程页（子Tab：实时定位 / 历史行程） -->
<div id="page-journal" class="page-content hidden">
    <div class="sub-tab-bar mb-6">
        <button onclick="switchTripTab('location')" class="sub-tab trip-tab active" data-trip="location">
            <i class="fa fa-map-marker"></i> 实时定位
        </button>
        <button onclick="switchTripTab('history')" class="sub-tab trip-tab" data-trip="history">
            <i class="fa fa-map-signs"></i> 历史行程
        </button>
    </div>

    <!-- ===== 子Tab：实时定位（高德地图） ===== -->
    <div id="tripTab-location" class="trip-tab-content">
        <div class="bg-white/80 backdrop-blur rounded-3xl p-6 card-shadow">
            <h2 class="text-xl font-bold text-love flex items-center mb-2">
                <i class="fa fa-map-marker mr-2"></i>我们的位置
            </h2>
            <div class="loc-status" id="locStatus">
                <span class="dot"></span>
                <span id="locStatusText">正在准备定位...</span>
            </div>

            <div class="loc-map" id="locMap"></div>

            <div class="loc-cards">
                <div class="loc-card">
                    <div class="loc-card-head">
                        <span class="loc-card-title"><i class="fa fa-heart"></i> TA 的位置</span>
                        <span class="loc-badge" id="locPartnerBadge">未知</span>
                    </div>
                    <div class="loc-addr" id="locPartnerAddr">暂无共享位置</div>
                    <div class="loc-meta" id="locPartnerMeta"></div>
                </div>
                <div class="loc-card">
                    <div class="loc-card-head">
                        <span class="loc-card-title"><i class="fa fa-map-marker"></i> 我的位置</span>
                        <span class="loc-badge" id="locSelfBadge">未开启</span>
                    </div>
                    <div class="loc-addr" id="locSelfAddr">等待定位授权...</div>
                    <div class="loc-meta" id="locSelfMeta"></div>
                </div>
            </div>

            <div class="loc-actions">
                <button class="loc-btn loc-btn-primary" onclick="window.shareMyLocationOnce()">
                    <i class="fa fa-location-arrow"></i> 立即更新
                </button>
                <button class="loc-btn loc-btn-ghost" id="locShareBtn" onclick="window.toggleLocationSharing()">
                    <i class="fa fa-pause"></i> 停止共享
                </button>
                <button class="loc-btn loc-btn-ghost" onclick="window.refreshLocations()">
                    <i class="fa fa-refresh"></i> 刷新
                </button>
                <a class="loc-btn loc-btn-ghost hidden" id="locPartnerNav" target="_blank" rel="noopener">
                    <i class="fa fa-external-link"></i> 高德查看
                </a>
            </div>

            <p class="loc-hint" id="locHint">
                登录后会自动共享你的位置；对方打开页面即可看到你的实时位置，离线时显示最后更新的位置。
            </p>
        </div>
    </div>

    <!-- ===== 子Tab：历史行程 ===== -->
    <div id="tripTab-history" class="trip-tab-content hidden">
        <div class="bg-white/80 backdrop-blur rounded-3xl p-6 card-shadow">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-xl font-bold text-love flex items-center">
                    <i class="fa fa-map-signs mr-2"></i>历史行程
                </h2>
                <button onclick="loadTripHistory()" class="text-sm text-gray-400 hover:text-love transition">
                    <i class="fa fa-refresh"></i> 刷新
                </button>
            </div>
            <p class="text-sm text-gray-500 mb-4">
                自动记录你们走过的位置：移动超过 1 公里或每 1 小时记录一次，按日期倒序展示。
            </p>
            <div id="tripHistoryList">
                <div class="text-center text-gray-400 py-6 text-sm">加载中...</div>
            </div>
        </div>
    </div>
</div>
