<!-- 游戏页 -->
<div id="page-game" class="page-content hidden">
    <!-- 情侣排行榜（共用） -->
    <div class="bg-white/80 backdrop-blur rounded-3xl p-6 card-shadow mb-6">
        <div class="flex items-center justify-between mb-3">
            <h3 class="font-bold text-love"><i class="fa fa-trophy mr-1 text-yellow-500"></i>情侣排行榜</h3>
            <button id="boardRefreshBtn" onclick="refreshCurrentBoard()" class="text-xs text-gray-400 hover:text-love"><i class="fa fa-refresh"></i> 刷新</button>
        </div>
        <div class="flex gap-2 mb-4">
            <button class="board-tab active px-4 py-1.5 rounded-full text-sm font-medium transition-all" data-game="jump" onclick="switchBoardTab('jump')">🐸 跳一跳</button>
        </div>
        <div id="boardMyBest" class="text-right text-sm text-gray-400 mb-2">最高分 —</div>
        <div id="boardList" class="space-y-2">
            <div class="text-center text-gray-400 py-4 text-sm">加载中...</div>
        </div>
    </div>

    <!-- 跳一跳 -->
    <div class="bg-white/80 backdrop-blur rounded-3xl p-6 card-shadow mb-6">
        <div class="flex gap-2 mb-4 items-center">
            <button class="game-tab active px-4 py-1.5 rounded-full text-sm font-medium transition-all" data-game="jump" onclick="switchGameTab('jump')">🐸 跳一跳</button>
            <button id="gameCacheRefreshBtn" onclick="refreshGameCache()" class="ml-auto flex items-center px-4 py-1.5 rounded-full text-sm font-medium bg-gray-100 text-gray-500 hover:bg-love hover:text-white transition-all" title="清除游戏缓存，加载最新版本">
                <i class="fa fa-refresh mr-1"></i>更新游戏
            </button>
        </div>
        <!-- 跳一跳面板 -->
        <div id="jumpGamePanel">
            <div class="flex items-center justify-end mb-2">
                <button id="jumpFullscreenBtn" onclick="jumpToggleFullscreen()" class="w-8 h-8 flex items-center justify-center rounded-full text-gray-400 hover:bg-rose-50 hover:text-love transition" title="全屏">
                    <i class="fa fa-expand"></i>
                </button>
            </div>
            <div id="jumpPlayArea" class="hidden mb-4 rounded-2xl overflow-hidden border border-rose-100">
                <iframe id="jumpFrame" src="about:blank" class="w-full h-[520px] block" allow="autoplay; fullscreen"></iframe>
            </div>
            <div class="flex justify-center">
                <button id="jumpStartBtn" onclick="jumpTogglePlay()" class="bg-love hover:bg-loveDark text-white px-8 py-2.5 rounded-full transition-all font-bold">
                    <i class="fa fa-play mr-1"></i>开始游戏
                </button>
            </div>
        </div>
    </div>

    <a href="./GameHub-main/index.html" class="mt-6 bg-white/80 backdrop-blur rounded-3xl p-6 card-shadow flex items-center justify-between hover:bg-rose-50 transition group">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-purple-400 to-pink-400 flex items-center justify-center text-white text-2xl">🕹️</div>
            <div>
                <h2 class="text-lg font-bold text-love">单机游戏合集</h2>
                <p class="text-sm text-gray-500">一个人也能玩的小游戏</p>
            </div>
        </div>
        <i class="fa fa-chevron-right text-gray-400 group-hover:text-love group-hover:translate-x-1 transition-all"></i>
    </a>
</div>
