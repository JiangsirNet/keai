<!DOCTYPE HTML>
<html>
<head>
    <meta http-equiv="content" content="text/html" charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1.0,maximum-scale=1,user-scalable=no" />
    <title>第 3 关 · 极地冰原 · 爱的飞行员</title>
    <link rel="stylesheet" type="text/css" href="css/main.css?v=18"/>
    <!-- 分数入库依赖：Supabase（必需）+ EmailJS（超越对方纪录时发邮件，可选） -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
</head>
<body>
<audio src="music/bg.mp3" loop="true" autoplay="autoplay"></audio>
<div id="contentdiv">
    <div id="startdiv" style="display:none">
        <h1 class="gameTit">爱的飞行员</h1>
        <div class="copyright">第 3 关 · 极地冰原</div>
    </div>
    <div id="maindiv">
        <div class="bg-layer" id="bgLayer0"></div>
        <div class="bg-layer" id="bgLayer1"></div>
        <div class="bg-layer" id="bgLayer2"></div>
        <div id="levelBanner">第 3 关 · 极地冰原</div>

        <!-- 第1关剧情层 -->
        <div id="storyOverlay">
            <div id="storyRecallTitle">回忆中</div>
            <div id="storyGlow"></div>
            <img id="storyAlien" src="image/boss1.png">
            <div id="storyBeam"></div>
            <div id="storyShield"></div>
            <div id="storyFlash"></div>
            <div id="shipHpWrap">
                <span id="shipHpName">外星飞船</span>
                <div id="shipHpBar"><div id="shipHpFill"></div></div>
            </div>
            <div id="storyFire"></div>
            <img id="storyPlane" class="story-plane" src="image/role/plane_xiaoai.png">
            <img id="storyPlane2" class="story-plane" src="image/role/plane_awei.png">
            <img id="storyCharL" class="story-char">
            <img id="storyCharR" class="story-char">
            <div id="storySubtitle"></div>
            <div id="storyDialog">
                <div id="storyName"></div>
                <div id="storyText"></div>
            </div>
            <div id="storyTip"></div>
            <button id="storySkipBtn">跳过剧情</button>
        </div>

        <div id="scorediv">
            <div style="height: 30px">
                <div class="fl"><label>分数：</label><label id="score" class="f16 c-green">0</label></div>
                <div class="fr"><label>历史最高分：</label><label id="highscore">0</label></div>
            </div>
            <div style="height: 30px">
                <div class="fl"><label>生命值：</label><label id="life" class="lifebar"></label></div>
                <div class="fr"><label>最高评分：</label><label id="highgrade">DDD</label></div>
            </div>
        </div>
        <div id="suspenddiv">
            <button>继续</button><br/>
            <button>重新开始</button><br/>
            <button onclick="end()">回到主页</button>
        </div>
        <div id="enddiv" class="enddiv">
            <p class="plantext">SCORE</p>
            <p id="planscore">0</p>
            <div><button class="endbtn" onclick="next()">下一步</button></div>
        </div>
        <div id="levelClearBox" class="level-clear-box">
            <p id="clearTitle">第 1 关 通过</p>
            <p class="f12">当前总分：<span id="clearScore" class="num">0</span></p>
            <div class="tac">
                <button class="endbtn" onclick="nextLevel()">进入下一关</button>
                <button class="endbtn" onclick="end()">回到主页</button>
            </div>
        </div>
        <div id="gradingBox" class="grading-box">
            <p class="missionstatus">Mission <span id="missionstatus">success</span></p>
            <p class="f12">您的评分：</p>
            <div id="grading" class="grading">SSS</div>
            <div class="detail f12">
                <div class="item">
                   <p>摧毁敌军飞机</p>
                   <p><span id="destroyedEnemys" class="num">50</span>架</p>
                </div>
                <div class="item">
                    <p>未击中敌军飞机</p>
                   <p><span id="missedEnemys" class="num">12</span>架</p>
                </div>
            </div>
            <div class="tac">
                <button class="endbtn" onclick="retryLevel()">重新挑战</button>
                <button class="endbtn" onclick="end()">回到主页</button>
            </div>
        </div>
    </div>
</div>
<script>
    // 阻止浏览器的默认上下左右滑动的行为
    document.querySelector('body').addEventListener('touchmove', function (ev) {
        ev.preventDefault();
    },{passive:false});
    window.onload = function(){
        if (typeof begin === 'function') begin();
    };
</script>
<script type="text/javascript" src="js/score.js?v=27"></script>
<script type="text/javascript" src="js/levels/level3.js"></script>
<script type="text/javascript" src="js/engine.js?v=4"></script>
</body>
</html>
