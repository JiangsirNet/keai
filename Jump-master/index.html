<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>跳一跳</title>
  <style>
    html,body{
      margin: 0;padding: 0;
      -webkit-user-select: none;
      overflow: hidden;
      /* 背景图 cover 适配：不变形，超出裁切；#4a6741 为图片加载前的兜底色 */
      background: #4a6741 url('跳一跳背景图.jpg') center / cover no-repeat;
    }
    /* 竖屏（手机端）使用竖版背景图，横屏（桌面端）用横版图 */
    @media (orientation: portrait){
      html,body{
        background-image: url('手机跳一跳背景图.jpg');
      }
    }
    .mask{
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: fixed;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
    }
    .content{
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 500px;
      max-width: 90vw;
      height: 500px;
      max-height: 90vh;
      border-radius: 20px;
      background: rgba(0,0,0,0.4);
      border: 5px solid rgba(255,255,255,0.05);

    }
    .score-container{
      color: #ffffff;
      text-align: center;
    }
    .title{
      font-size: 20px;
      font-weight: bold;
      color: rgba(255,255,255,0.6);
    }
    .score{
      font-size: 100px;
      font-weight: bold;
      margin-top: 20px;
    }
    @media (max-width: 500px){
      .score{ font-size: 64px; margin-top: 10px; }
    }
    button.restart{
      width: 200px;
      height: 40px;
      border-radius: 20px;
      background: white;
      border: none;
      font-weight: bold;
      font-size: 20px;
      cursor: pointer;
    }
    button.restart:hover{
      color:#232323;
    }
    .info{
      margin: 20px 0;
      position: absolute;
      text-align: center;
      opacity: 0.2;
      width:100%;
    }
    .gaming-score{
      margin-top: 50px;
      color: #FFF;
      font-size: 26px;
    }
	audio{
		margin-top: 10px;
	}
    /* ===== 道具状态栏 & 拾取提示 ===== */
    .item-hud{
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 20;
      pointer-events: none;
    }
    .item-hud .buff{
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      line-height: 1;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
    }
    .item-hud .buff b{
      color: #ffd54a;
    }
    .item-hud .buff.lives b{
      color: #ff5a7a;
    }
    .item-hud .buff.warn{
      background: rgba(217,119,6,0.6);
      border-color: rgba(255,220,150,0.5);
    }
    .item-toast{
      position: fixed;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      padding: 12px 26px;
      border-radius: 18px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      font-size: 28px;
      font-weight: bold;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      z-index: 30;
      text-shadow: 0 2px 6px rgba(0,0,0,0.4);
      transition: opacity .25s ease, transform .25s ease;
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
    }
    .item-toast.show{
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    @media (max-width: 500px){
      .item-toast{ font-size: 22px; padding: 10px 20px; }
      .item-hud .buff{ font-size: 14px; padding: 5px 12px; }
    }
  </style>
</head>
<body>
<div class="mask">
  <div class="content">
    <div class="score-container">
      <p class="title">本次得分</p>
      <h1 class="score">0</h1>
    </div>
    <button class="restart">
      重新开始
    </button>
  </div>
</div>
<div class="info">
  <div class="gaming-score">
    得分：<span class="current-score">0</span>
  </div>
</div>
<div class="item-hud" id="itemHud"></div>
<div class="item-toast" id="itemToast"></div>
</body>
</html>
<script src="js/three.min.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
