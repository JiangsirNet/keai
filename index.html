<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的情侣空间</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        love: '#ff6b8b',
                        loveDark: '#e04c6e'
                    }
                }
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ffe6ec, #fff0f4);
            min-height: 100vh;
            font-family: "Microsoft Yahei", sans-serif;
            overflow-x: hidden;
        }

        .heart {
            position: fixed;
            color: #ff6b8b;
            opacity: 0.7;
            animation: fall linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10px) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            90% {
                opacity: 0.7;
            }

            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 1;
        }

        .card-shadow {
            box-shadow: 0 8px 30px rgba(255, 107, 139, 0.18);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #ffb4c4;
            border-radius: 10px;
        }

        .loading {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.5
            }

            50% {
                opacity: 1
            }
        }

        .img-preview-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .img-preview-modal img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 12px;
        }

        .hidden {
            display: none !important;
        }

        .img-loading {
            background: #fde8ee;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            border-radius: 12px;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #ffd0db;
            border-top-color: #ff6b8b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .img-card img {
            transition: opacity 0.3s ease;
        }

        .img-card img.loading {
            opacity: 0;
        }

        .img-card img.loaded {
            opacity: 1;
        }

        .img-card img.error {
            opacity: 1;
            filter: grayscale(1) brightness(0.85);
        }

        .img-error-tip {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #ff6b8b;
            font-size: 12px;
            cursor: pointer;
        }

        .img-error-tip i {
            font-size: 22px;
        }

        .journal-item {
            transition: all 0.2s ease;
        }

        .journal-item:hover {
            transform: translateX(2px);
        }

        /* 音乐播放器 */
        .music-panel {
            position: fixed;
            top: 70px;
            right: 20px;
            z-index: 100;
            width: 280px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 10px 40px rgba(255, 107, 139, 0.25);
            border: 1px solid #ffe0e8;
        }

        .music-panel.hidden-panel {
            display: none;
        }

        .music-cover {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b8b, #ffb4c4);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            animation: rotate 8s linear infinite;
            animation-play-state: paused;
        }

        .music-cover.playing {
            animation-play-state: running;
        }

        .music-cover i {
            font-size: 32px;
            color: white;
        }

        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        .music-title {
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-progress {
            height: 4px;
            background: #ffe0e8;
            border-radius: 2px;
            cursor: pointer;
            margin-bottom: 10px;
            position: relative;
        }

        .music-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff6b8b, #ffb4c4);
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .music-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
        }

        .music-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: #fde8ee;
            color: #ff6b8b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .music-btn:hover {
            background: #ff6b8b;
            color: white;
        }

        .music-btn.play {
            width: 44px;
            height: 44px;
            background: #ff6b8b;
            color: white;
        }

        .music-btn.play:hover {
            background: #e04c6e;
        }

        .music-time {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #999;
            margin-bottom: 10px;
        }

        .music-list {
            max-height: 120px;
            overflow-y: auto;
            border-top: 1px solid #ffe0e8;
            padding-top: 8px;
        }

        .music-item {
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #555;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .music-item:hover {
            background: #fde8ee;
        }

        .music-item.active {
            background: #ff6b8b;
            color: white;
        }

        .music-item .del {
            opacity: 0;
            font-size: 12px;
        }

        .music-item:hover .del {
            opacity: 1;
        }

        .music-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 99;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b8b, #ffb4c4);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 139, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: transform 0.3s;
        }

        .music-toggle:hover {
            transform: scale(1.1);
        }

        .music-toggle.playing {
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 4px 15px rgba(255, 107, 139, 0.4); }
            50% { box-shadow: 0 4px 25px rgba(255, 107, 139, 0.7); }
        }

        /* BGM 开关按钮 */
        .bgm-toggle {
            position: fixed;
            top: 20px;
            right: 74px;
            z-index: 99;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a78bfa, #c4b5fd);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(167, 139, 250, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: transform 0.3s;
        }

        .bgm-toggle:hover {
            transform: scale(1.1);
        }

        .bgm-toggle.playing {
            animation: pulse-glow-purple 2s ease-in-out infinite;
        }

        @keyframes pulse-glow-purple {
            0%, 100% { box-shadow: 0 4px 15px rgba(167, 139, 250, 0.4); }
            50% { box-shadow: 0 4px 25px rgba(167, 139, 250, 0.7); }
        }

        .music-upload {
            font-size: 11px;
            color: #ff6b8b;
            cursor: pointer;
            text-align: center;
            margin-top: 8px;
            display: block;
        }

        .music-upload:hover {
            text-decoration: underline;
        }

        /* 骗子酒馆卡牌 */
        .lb-card {
            width: 44px; height: 62px;
            border-radius: 6px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-size: 14px; font-weight: bold;
            cursor: pointer; user-select: none;
            transition: all 0.2s;
            position: relative;
        }
        .lb-card.face-up {
            background: #fff;
            border: 2px solid #e5e7eb;
            color: #1f2937;
        }
        .lb-card.face-up.red { color: #dc2626; }
        .lb-card.face-down {
            background: linear-gradient(135deg, #f43f5e, #be123c);
            border: 2px solid #9f1239;
            color: rgba(255,255,255,0.3);
        }
        .lb-card.face-down::after {
            content: "🂠"; font-size: 28px; color: rgba(255,255,255,0.5);
        }
        .lb-card.selected {
            transform: translateY(-12px);
            box-shadow: 0 -4px 8px rgba(244,63,94,0.3);
            border-color: #f43f5e;
        }
        .lb-card.played { cursor: default; }

        /* 语音录制按钮动画 */
        #voiceBtn.recording {
            background: #ef4444;
            color: #fff;
            border-color: #ef4444;
            animation: record-pulse 1.2s ease infinite;
        }
        @keyframes record-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
            50% { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
        }

        /* 哈士奇宠物 */
        .husky-pet {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 90;
            width: 100px;
            height: 100px;
            cursor: pointer;
            transition: transform 0.3s ease;
            user-select: none;
            touch-action: none;
        }

        .husky-pet svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.15));
        }

        .husky-pet.walking {
            animation: husky-bounce 0.4s ease infinite alternate;
        }

        @keyframes husky-bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-4px); }
        }

        .husky-pet.happy {
            animation: husky-happy 0.5s ease;
        }

        @keyframes husky-happy {
            0%, 100% { transform: scale(1) rotate(0); }
            25% { transform: scale(1.15) rotate(-5deg); }
            75% { transform: scale(1.15) rotate(5deg); }
        }

        .husky-tail {
            transform-origin: 70px 65px;
            animation: tail-wag 0.5s ease infinite alternate;
        }

        @keyframes tail-wag {
            from { transform: rotate(-15deg); }
            to { transform: rotate(20deg); }
        }

        .husky-ear-l {
            transform-origin: 38px 28px;
            animation: ear-twitch 3s ease infinite;
        }

        @keyframes ear-twitch {
            0%, 90%, 100% { transform: rotate(0); }
            93% { transform: rotate(-10deg); }
            96% { transform: rotate(5deg); }
        }

        .husky-bubble {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            color: #ff6b8b;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .husky-bubble:after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-top-color: white;
            border-bottom: 0;
        }

        .husky-bubble.show {
            opacity: 1;
        }

        .husky-heart {
            position: absolute;
            color: #ff6b8b;
            font-size: 20px;
            pointer-events: none;
            opacity: 0;
        }

        @keyframes heart-float {
            0% { opacity: 1; transform: translate(0, 0) scale(0.5); }
            100% { opacity: 0; transform: translate(var(--dx), -80px) scale(1.2); }
        }

        /* 暹罗猫宠物 */
        .cat-pet {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 90;
            width: 100px;
            height: 100px;
            cursor: pointer;
            transition: transform 0.3s ease;
            user-select: none;
            touch-action: none;
        }

        .cat-pet svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.15));
        }

        .cat-pet.walking {
            animation: cat-sneak 0.5s ease infinite alternate;
        }

        @keyframes cat-sneak {
            from { transform: translateY(0); }
            to { transform: translateY(-3px); }
        }

        .cat-pet.happy {
            animation: cat-happy 0.5s ease;
        }

        @keyframes cat-happy {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .cat-tail {
            transform-origin: 72px 58px;
            animation: cat-tail-swish 1.2s ease infinite alternate;
        }

        @keyframes cat-tail-swish {
            from { transform: rotate(-5deg); }
            to { transform: rotate(25deg); }
        }

        .cat-ear-l {
            transform-origin: 30px 30px;
            animation: cat-ear-twitch 4s ease infinite;
        }

        @keyframes cat-ear-twitch {
            0%, 85%, 100% { transform: rotate(0); }
            88% { transform: rotate(-8deg); }
            91% { transform: rotate(3deg); }
        }

        .cat-bubble {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            color: #a78bfa;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .cat-bubble:after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-top-color: white;
            border-bottom: 0;
        }

        .cat-bubble.show {
            opacity: 1;
        }

        /* ==================== 手机端适配 ==================== */
        @media (max-width: 768px) {
            /* 主容器减小内边距 */
            .container {
                padding: 12px 12px 80px 12px !important;
            }

            /* 卡片减小内边距 */
            .bg-white\/80 {
                padding: 16px !important;
                border-radius: 20px !important;
            }

            /* 标题缩小 */
            .bg-white\/80 h2 {
                font-size: 1.05rem !important;
            }

            /* 相册网格单列 */
            #galleryWrap {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px !important;
            }

            /* 日志标题和日期改为纵向排列 */
            #journalTitle,
            #journalDate {
                width: 100% !important;
                flex: none !important;
            }

            .flex.gap-2.mb-3 {
                flex-direction: column;
                gap: 8px !important;
            }

            /* 留言和日志高度适配 */
            #msgInput {
                height: 80px !important;
            }

            #journalContent {
                height: 100px !important;
            }

            /* 日志列表高度限制 */
            #journalList {
                max-height: 350px !important;
            }

            /* 音乐面板适配 */
            .music-panel {
                width: calc(100vw - 24px) !important;
                right: 12px !important;
                top: 60px !important;
                padding: 14px !important;
            }

            /* 音乐按钮和退出登录不重叠 */
            .music-toggle {
                top: 12px !important;
                right: 12px !important;
                width: 38px !important;
                height: 38px !important;
                font-size: 15px !important;
            }

            .bgm-toggle {
                top: 12px !important;
                right: 54px !important;
                width: 38px !important;
                height: 38px !important;
                font-size: 15px !important;
            }

            /* 退出登录按钮左移避免遮挡 */
            #mainPage > .flex.justify-end {
                padding-right: 50px;
            }

            /* 宠物缩小 */
            .husky-pet,
            .cat-pet {
                width: 70px !important;
                height: 70px !important;
            }

            .husky-pet {
                left: 10px;
            }

            .cat-pet {
                right: 10px;
            }

            /* 大图预览 */
            .img-preview-modal img {
                max-width: 95vw !important;
                max-height: 80vh !important;
            }

            /* 登录面板 */
            #loginPanel > div {
                padding: 20px !important;
            }

            /* 留言列表项优化 */
            #msgList > div {
                padding: 10px 12px !important;
                font-size: 0.85rem !important;
            }

            /* 日志项优化 */
            .journal-item {
                padding: 12px !important;
            }

            .journal-item h3 {
                font-size: 0.9rem !important;
            }

            .journal-item p {
                font-size: 0.8rem !important;
            }

            /* 按钮触摸友好 */
            button {
                min-height: 40px;
            }

            /* 底部留白给宠物 */
            #mainPage {
                padding-bottom: 90px !important;
            }
        }

        /* 超小屏幕（<375px） */
        @media (max-width: 374px) {
            .container {
                padding: 8px 8px 80px 8px !important;
            }

            .bg-white\/80 {
                padding: 12px !important;
            }

            #galleryWrap {
                grid-template-columns: 1fr !important;
            }

            .husky-pet,
            .cat-pet {
                width: 56px !important;
                height: 56px !important;
            }
        }
    </style>
</head>

<body>
    <div id="heartBox"></div>

    <!-- 哈士奇宠物 -->
    <div id="huskyPet" class="husky-pet hidden" onclick="petHusky()" onmousedown="startDragHusky(event)" ontouchstart="startDragHusky(event)">
        <div class="husky-bubble" id="huskyBubble"></div>
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <!-- 尾巴 -->
            <path class="husky-tail" d="M70 65 Q82 55 80 42" stroke="#5a6b7a" stroke-width="6" fill="none" stroke-linecap="round"/>
            <!-- 身体 -->
            <ellipse cx="55" cy="62" rx="22" ry="16" fill="#dfe7ee"/>
            <!-- 腿 -->
            <rect x="40" y="68" width="7" height="18" rx="3" fill="#5a6b7a"/>
            <rect x="50" y="68" width="7" height="18" rx="3" fill="#c8d3dc"/>
            <rect x="60" y="68" width="7" height="18" rx="3" fill="#5a6b7a"/>
            <rect x="70" y="68" width="7" height="18" rx="3" fill="#c8d3dc"/>
            <!-- 头 -->
            <circle cx="35" cy="42" r="18" fill="#dfe7ee"/>
            <!-- 左耳 -->
            <path class="husky-ear-l" d="M25 28 L22 16 L32 24 Z" fill="#5a6b7a"/>
            <!-- 右耳 -->
            <path d="M45 28 L48 16 L38 24 Z" fill="#5a6b7a"/>
            <!-- 面部白纹 -->
            <path d="M35 30 L30 42 L35 50 L40 42 Z" fill="white"/>
            <!-- 左眼 -->
            <circle cx="29" cy="40" r="3" fill="#1a1a2e"/>
            <circle cx="30" cy="39" r="1" fill="white"/>
            <!-- 右眼 -->
            <circle cx="41" cy="40" r="3" fill="#1a1a2e"/>
            <circle cx="42" cy="39" r="1" fill="white"/>
            <!-- 鼻子 -->
            <ellipse cx="35" cy="47" rx="3" ry="2" fill="#1a1a2e"/>
            <!-- 嘴 -->
            <path id="huskyMouth" d="M35 49 Q35 53 32 53 M35 49 Q35 53 38 53" stroke="#1a1a2e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            <!-- 舌头（隐藏） -->
            <ellipse id="huskyTongue" cx="35" cy="54" rx="3" ry="4" fill="#ff6b8b" style="display:none"/>
        </svg>
    </div>

    <!-- 暹罗猫宠物 -->
    <div id="catPet" class="cat-pet hidden" onclick="petCat()" onmousedown="startDragCat(event)" ontouchstart="startDragCat(event)">
        <div class="cat-bubble" id="catBubble"></div>
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <!-- 尾巴 -->
            <path class="cat-tail" d="M72 58 Q88 48 82 30" stroke="#6b5444" stroke-width="5" fill="none" stroke-linecap="round"/>
            <!-- 身体 -->
            <ellipse cx="55" cy="60" rx="20" ry="15" fill="#f0e6dc"/>
            <!-- 腿 -->
            <rect x="42" y="66" width="6" height="18" rx="3" fill="#6b5444"/>
            <rect x="50" y="66" width="6" height="18" rx="3" fill="#f0e6dc"/>
            <rect x="60" y="66" width="6" height="18" rx="3" fill="#6b5444"/>
            <rect x="68" y="66" width="6" height="18" rx="3" fill="#f0e6dc"/>
            <!-- 头 -->
            <circle cx="35" cy="42" r="17" fill="#f0e6dc"/>
            <!-- 暹罗猫面部深色面具 -->
            <ellipse cx="35" cy="44" rx="13" ry="11" fill="#6b5444"/>
            <!-- 左耳 -->
            <path class="cat-ear-l" d="M22 30 L18 14 L30 24 Z" fill="#6b5444"/>
            <path d="M24 27 L22 18 L28 24 Z" fill="#f0b8c0"/>

        // 从数据库 app_config 表读取所有配置

        // ImgBB上传
        // 压缩图片：按最大边长缩放 + JPEG 质量压缩
        function compressImage(file, maxDim, quality) {
            return new Promise((resolve) => {
                // 小于 500KB 直接返回原文件
                if (file.size < 500 * 1024) { resolve(file); return; }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let { width, height } = img;
                        if (width > maxDim || height > maxDim) {
                            if (width >= height) {
                                height = Math.round(height * maxDim / width);
                                width = maxDim;
                            } else {
                                width = Math.round(width * maxDim / height);
                                height = maxDim;
                            }
                        }
                        const canvas = document.createElement("canvas");
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            const out = new File([blob], file.name.replace(/\.\w+$/, ".jpg"), { type: "image/jpeg" });
                            console.log(`压缩: ${(file.size/1024/1024).toFixed(2)}MB → ${(out.size/1024/1024).toFixed(2)}MB`);
                            resolve(out);
                        }, "image/jpeg", quality);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function uploadImageToImgBB(e) {
            const file = e.target.files[0];
            const uploadBtn = document.getElementById("uploadBtn");
            if (!file || !IMGBB_KEY) {
                alert("缺少ImgBB密钥，请重新登录");
                e.target.value = "";
                return;
            }

            const maxSize = 32 * 1024 * 1024;
            if (file.size > maxSize) {
                alert("图片不能超过32MB");
                e.target.value = "";
                return;
            }
            const allowType = ["image/jpeg", "image/png", "image/webp"];
            if (!allowType.includes(file.type)) {
                alert("仅支持jpg/png/webp");
                e.target.value = "";
                return;
            }

            uploadBtn.innerText = "压缩中...";
            uploadBtn.disabled = true;

            try {
                // 压缩图片
                const compressedFile = await compressImage(file, 1920, 0.8);

                uploadBtn.innerText = "上传中...";

                const formData = new FormData();
                formData.append('image', compressedFile);
                formData.append('key', IMGBB_KEY);

                const res = await fetch(`https://api.imgbb.com/1/upload`, {
                    method: "POST",
                    body: formData
                });
                const result = await res.json();
                if (!result.success) throw new Error(result.error?.message || "上传失败");

                const imgUrl = result.data.url;
                const deleteUrl = result.data.delete_url;

                await sb.from("gallery").insert({ img_url: imgUrl, delete_url: deleteUrl });
                loadGallery();
            } catch (err) {
                console.error(err);
                alert("图片上传失败：" + err.message);
            } finally {
                uploadBtn.innerHTML = '<i class="fa fa-upload mr-1"></i>上传合照';
                uploadBtn.disabled = false;
                e.target.value = "";
            }
        }

        // 删除照片
        async function deletePhoto(id, deleteLink) {
            if (!confirm("确定删除照片？无法恢复！")) return;
            try {
                await fetch(deleteLink);
            } catch (e) {
                console.log("远程图片删除失败，仅清理数据库记录");
            }
            await sb.from("gallery").delete().eq("id", id);
            loadGallery();
        }

        //加载相册
        async function loadGallery() {
            const { data } = await sb.from("gallery").select("*").order("create_at", { asc: false });
            const wrap = document.getElementById("galleryWrap");
            wrap.innerHTML = "";
            if (!data || data.length === 0) {
                wrap.innerHTML = `<div class="col-span-2 text-center text-gray-400 py-10">暂无照片，上传第一张合照吧💖</div>`;
                return;
            }
            data.forEach(item => {
                const div = document.createElement("div");
                div.className = "img-card relative group";
                div.innerHTML = `
            <div class="img-loading absolute inset-0 z-10" id="loading-${item.id}"><div class="spinner"></div></div>
            <img src="${item.img_url}" class="loading aspect-square rounded-xl object-cover w-full cursor-pointer hover:opacity-90"
                onclick="openPreview('${item.img_url}')"
                onload="onImgLoaded(this,'${item.id}')"
                onerror="onImgError(this,'${item.id}','${item.img_url}')">
            <div class="img-error-tip hidden" id="err-${item.id}" onclick="retryImg('${item.id}','${item.img_url}')">

        let mediaRecorder = null;

        let recordSeconds = 0;

        async function toggleVoiceRecord() {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                voiceChunks = [];
                mediaRecorder.ondataavailable = (e) => voiceChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach(t => t.stop());
                    clearInterval(recordTimer);
                    const btn = document.getElementById("voiceBtn");
                    btn.classList.remove("recording");
                    document.getElementById("voiceBtnText").textContent = "上传中...";
                    document.getElementById("recordTimer").classList.add("hidden");

                    const blob = new Blob(voiceChunks, { type: "audio/webm" });
                    if (blob.size < 1000) { alert("录音太短"); document.getElementById("voiceBtnText").textContent = "语音留言"; return; }

                    try {
                        const fileName = `voice_${Date.now()}.webm`;
                        const { data, error } = await sb.storage.from("music").upload(fileName, blob);
                        if (error) throw error;
                        const url = sb.storage.from("music").getPublicUrl(data.path).data.publicUrl;
                        const { data: { user } } = await sb.auth.getUser();
                        const username = user?.email || "匿名";
                        await sb.from("messages").insert({ content: "🎤 语音留言", voice_url: url, username });
                        loadMessages();
                    } catch (err) {
                        alert("语音上传失败：" + err.message);
                    } finally {
                        document.getElementById("voiceBtnText").textContent = "语音留言";
                    }
                };
                mediaRecorder.start();
                const btn = document.getElementById("voiceBtn");
                btn.classList.add("recording");
                document.getElementById("voiceBtnText").textContent = "停止录音";
                document.getElementById("recordTimer").classList.remove("hidden");
                recordSeconds = 0;
                recordTimer = setInterval(() => {
                    recordSeconds++;
                    const m = String(Math.floor(recordSeconds / 60)).padStart(2, "0");
                    const s = String(recordSeconds % 60).padStart(2, "0");
                    document.getElementById("recordTimer").textContent = `${m}:${s}`;
                    if (recordSeconds >= 120) mediaRecorder.stop();
                }, 1000);
            } catch (err) {
                alert("无法访问麦克风：" + err.message);
            }
        }

        let lbSessionId = Date.now() + "-" + Math.random().toString(36).substr(2, 9);

        function lbInit() {

            lbChannel = sb.channel("liar-bar", { config: { broadcast: { self: false } } });
            lbChannel
                .on("broadcast", { event: "invite" }, ({ payload }) => {
                    if (payload.from === myRpsEmail) return;
                    // 记录对方最新会话 ID（新会话表示对方已重连，旧的 quit 应被忽略）
                    if (payload.sid) partnerLbSession = payload.sid;
                    document.getElementById("lbMessage").textContent = "收到对方邀请！";
                    const a = document.getElementById("lbActions");
                    a.innerHTML = "";
                    const btn = lbEnsureStartBtn();
                    btn.textContent = "接受邀请";
                    btn.onclick = lbAccept;

                    a.appendChild(btn);
                    lbIsInitiator = false;
                })
                .on("broadcast", { event: "accept" }, ({ payload }) => {
                    if (payload.from === myRpsEmail) return;
                    lbBeginGame(true);
                })
                .on("broadcast", { event: "play" }, ({ payload }) => {
                    if (payload.from === myRpsEmail) return;
                    lbPartnerPlayedCards = payload.cards;
                    lbRenderPartnerPlayed(false);
                    document.getElementById("lbMessage").textContent = `对方出了${payload.cards.length}张牌，声称都是「${lbTargetRank}」`;
                    lbShowRespondButtons();

                .on("broadcast", { event: "call" }, ({ payload }) => {
                    if (payload.from === myRpsEmail) return;
                    lbDoReveal("partner");
                })
                .on("broadcast", { event: "believe" }, ({ payload }) => {
                    if (payload.from === myRpsEmail) return;
                    lbPartnerPlayedCards = [];
                    lbRenderPartnerPlayed(false);
                    lbMyTurn = false;
                    document.getElementById("lbMessage").textContent = "对方相信了，等待对方出牌...";
                    lbShowWaitButtons();
                })
                .on("broadcast", { event: "newRound" }, ({ payload }) => {
                    if (payload.from === myRpsEmail) return;
                    lbTargetRank = payload.rank;
                    lbMyTurn = !payload.first;
                    lbPartnerPlayedCards = [];
                    lbSelected = [];
                    // 重新发牌（保证至少一张目标牌型）
                    lbMyCards = lbDealCardsWithTarget(5, lbTargetRank);
                    lbUpdateTargetRank();
                    lbRenderHand();
                    lbRenderPartnerPlayed(false);
                    if (lbMyTurn) {
                        document.getElementById("lbMessage").textContent = `新一轮！目标：${lbTargetRank}，轮到你出牌`;
                        lbShowPlayButtons();
                    } else {
                        document.getElementById("lbMessage").textContent = `新一轮！目标：${lbTargetRank}，等待对方出牌...`;
                        lbShowWaitButtons();
                    }
                })
                .on("broadcast", { event: "gameOver" }, ({ payload }) => {
                    if (payload.from === myRpsEmail) return;
                    lbPhase = "gameOver";
                    document.getElementById("lbMessage").textContent = "你赢了！🎉";
                    const a = document.getElementById("lbActions");
                    a.innerHTML = "";
                    const btn = lbEnsureStartBtn();
                    btn.textContent = "再来一局";
                    btn.onclick = lbStart;
                    btn.classList.remove("hidden");
                    btn.disabled = false;
                    a.appendChild(btn);
                })
                .on("broadcast", { event: "trigger" }, ({ payload }) => {
                    if (payload.from === myRpsEmail) return;
                    lbChamber = payload.chamber + 1;
                    // emptyWin=true 表示对方打完牌，我方受罚；否则是揭穿受罚
                    const isMe = payload.emptyWin ? true : false;
                    lbShowTriggerAnim(payload.hit, isMe);
                })
                .on("broadcast", { event: "revolver" }, ({ payload }) => {
                    if (payload.from === myRpsEmail) return;
                    lbBulletPos = payload.bullet;
                    lbChamber = 1;
                })
                .on("presence", { event: "sync" }, () => {
                    const state = lbChannel.presenceState();
                    let partnerOnline = false;
                    let latestPartnerSid = null;
                    Object.values(state).forEach(arr => {
                        arr.forEach(p => {
                            if (p.user && p.user.toLowerCase() !== myRpsEmail) {
                                partnerOnline = true;
                                if (p.sid) latestPartnerSid = p.sid;
                            }
                        });
                    });
                    // 更新对方最新会话 ID
                    if (latestPartnerSid) partnerLbSession = latestPartnerSid;
                    // 任意非空闲阶段对方掉线，终止并重置
                    if (!partnerOnline && lbPhase !== "idle") {
                        const wasPlaying = lbPhase === "playing";
                        lbResetToIdle(wasPlaying ? "对方已掉线，游戏终止" : "对方已掉线");
                    }
                })
                .on("broadcast", { event: "quit" }, ({ payload }) => {
                    if (payload.from === myRpsEmail) return;
                    // 仅当 quit 来自对方当前会话时才终止；若会话 ID 不匹配，说明是陈旧信号（对方已重连）
                    if (partnerLbSession && payload.sid !== partnerLbSession) return;
                    if (lbPhase !== "idle") {
                        const wasPlaying = lbPhase === "playing";
                        lbResetToIdle(wasPlaying ? "对方已离开，游戏终止" : "对方已离开");
                    }
                })
                .subscribe(async (status) => {
                    if (status === "SUBSCRIBED") await lbChannel.track({ user: myRpsEmail, sid: lbSessionId });
                });

            // 页面刷新/关闭时主动通知对方退出
            window.addEventListener("beforeunload", () => {
                if (lbChannel && lbPhase !== "idle") {
                    try {
                        lbChannel.send({ type: "broadcast", event: "quit", payload: { from: myRpsEmail, sid: lbSessionId } });
                    } catch (e) {}
                }
            });
        }

        function lbStart() {
            lbChannel.send({ type: "broadcast", event: "invite", payload: { from: myRpsEmail, sid: lbSessionId } });
            document.getElementById("lbMessage").textContent = "已发送邀请，等待对方接受...";
            document.getElementById("lbStartBtn").textContent = "等待中...";
            document.getElementById("lbStartBtn").disabled = true;
            lbIsInitiator = true;
            lbPhase = "inviting";
        }

        function lbAccept() {
            lbChannel.send({ type: "broadcast", event: "accept", payload: { from: myRpsEmail } });
            lbBeginGame(false);
        }

        function lbBeginGame(iStart) {
            lbPhase = "playing";
            lbMyHP = 1; lbPartnerHP = 1;
            // 初始化左轮手枪：6个弹巢，1颗子弹
            lbBulletPos = Math.floor(Math.random() * 6) + 1;
            lbChamber = 1;
            lbChannel.send({ type: "broadcast", event: "revolver", payload: { bullet: lbBulletPos, from: myRpsEmail } });
            lbTargetRank = lbRanks[Math.floor(Math.random() * lbRanks.length)];
            lbMyCards = lbDealCardsWithTarget(5, lbTargetRank);
            lbMyTurn = iStart;
            lbSelected = [];
            lbPartnerPlayedCards = [];
            document.getElementById("lbStartBtn").classList.add("hidden");
            lbUpdateHP();
            lbUpdateTargetRank();
            lbRenderHand();
            lbRenderPartnerPlayed(false);
            if (lbMyTurn) {
                document.getElementById("lbMessage").textContent = `游戏开始！目标：${lbTargetRank}，你先出牌`;
                lbShowPlayButtons();
            } else {
                document.getElementById("lbMessage").textContent = `游戏开始！目标：${lbTargetRank}，等待对方出牌...`;
                lbShowWaitButtons();
            }
            // 发送目标牌型给对方
            if (iStart) {
                lbChannel.send({ type: "broadcast", event: "newRound", payload: { rank: lbTargetRank, first: true, from: myRpsEmail } });
            }
        }

        function lbDealCards(n) {
            const cards = [];
            for (let i = 0; i < n; i++) {
                cards.push({
                    rank: lbRanks[Math.floor(Math.random() * lbRanks.length)],
                    suit: lbSuits[Math.floor(Math.random() * 4)]
                });
            }
            return cards;
        }

        // 发牌时保证至少一张目标牌型，且提高出现概率，最多4张
        function lbDealCardsWithTarget(n, targetRank) {
            const cards = lbDealCards(n);
            // 30% 概率每张牌变成目标牌型
            cards.forEach(c => {
                if (Math.random() < 0.3) {
                    c.rank = targetRank;
                    c.suit = lbSuits[Math.floor(Math.random() * 4)];
                }
            });
            // 限制目标牌型最多4张，超过则改回随机牌
            let targetCount = cards.filter(c => c.rank === targetRank).length;
            while (targetCount > 4) {
                const idx = cards.findIndex(c => c.rank === targetRank);
                cards[idx].rank = lbRanks[Math.floor(Math.random() * lbRanks.length)];
                cards[idx].suit = lbSuits[Math.floor(Math.random() * 4)];
                if (cards[idx].rank === targetRank) cards[idx].rank = lbRanks[0];
                targetCount = cards.filter(c => c.rank === targetRank).length;
            }
            // 保证至少一张目标牌型
            const hasTarget = cards.some(c => c.rank === targetRank);
            if (!hasTarget) {
                const idx = Math.floor(Math.random() * n);
                cards[idx].rank = targetRank;
                cards[idx].suit = lbSuits[Math.floor(Math.random() * 4)];
            }
            return cards;
        }

        function lbRenderHand() {
            const wrap = document.getElementById("lbMyHand");
            wrap.innerHTML = "";
            lbMyCards.forEach((c, i) => {
                const div = document.createElement("div");
                const isRed = lbRedSuits.includes(c.suit);
                div.className = `lb-card face-up ${isRed ? "red" : ""} ${lbSelected.includes(i) ? "selected" : ""}`;
                div.innerHTML = `<span>${c.suit}</span><span>${c.rank}</span>`;
                div.onclick = () => {
                    if (!lbMyTurn || lbPhase !== "playing") return;
                    const idx = lbSelected.indexOf(i);
                    if (idx >= 0) lbSelected.splice(idx, 1);
                    else if (lbSelected.length < 3) lbSelected.push(i);
                    lbRenderHand();
                };
                wrap.appendChild(div);
            });
        }

        function lbRenderPartnerPlayed(reveal) {
            const wrap = document.getElementById("lbPartnerPlayed");
            wrap.innerHTML = "";
            if (lbPartnerPlayedCards.length === 0) return;
            lbPartnerPlayedCards.forEach(c => {
                const div = document.createElement("div");
                if (reveal) {
                    const isRed = lbRedSuits.includes(c.suit);
                    div.className = `lb-card face-up played ${isRed ? "red" : ""}`;
                    div.innerHTML = `<span>${c.suit}</span><span>${c.rank}</span>`;
                } else {
                    div.className = "lb-card face-down played";
                }
                wrap.appendChild(div);
            });
        }

        function lbPlay() {
            if (lbSelected.length === 0) return alert("请选择1-3张牌");
            sfxPlay();
            const played = lbSelected.map(i => lbMyCards[i]);
            lbMyPlayedCards = played;
            lbChannel.send({ type: "broadcast", event: "play", payload: { cards: played, from: myRpsEmail } });
            lbSelected.sort((a, b) => b - a).forEach(i => lbMyCards.splice(i, 1));
            lbSelected = [];
            lbRenderHand();
            // 手牌打完了，对方接受水枪惩罚
            if (lbMyCards.length === 0) {
                lbMyTurn = false;
                document.getElementById("lbMessage").textContent = "你打完所有牌！对方接受水枪惩罚 🔫";
                lbShowWaitButtons();
                setTimeout(() => {
                    const hit = lbChamber === lbBulletPos;
                    lbChannel.send({ type: "broadcast", event: "trigger", payload: { from: myRpsEmail, chamber: lbChamber, hit, emptyWin: true } });
                    lbShowTriggerAnim(hit, false); // false = 对方受罚
                }, 1200);
                return;
            }
            lbMyTurn = false;
            document.getElementById("lbMessage").textContent = "已出牌，等待对方回应...";
            lbShowWaitButtons();
        }

        function lbCall() {
            lbChannel.send({ type: "broadcast", event: "call", payload: { from: myRpsEmail } });
            lbDoReveal("me");
        }

        function lbBelieve() {
            lbChannel.send({ type: "broadcast", event: "believe", payload: { from: myRpsEmail } });
            lbPartnerPlayedCards = [];
            lbRenderPartnerPlayed(false);
            lbMyTurn = true;
            document.getElementById("lbMessage").textContent = "你相信了，现在轮到你出牌！";
            lbShowPlayButtons();
        }

        function lbDoReveal(caller) {
            let allMatch, loserIsMe, iStartNext;
            if (caller === "me") {
                lbRenderPartnerPlayed(true);
                allMatch = lbPartnerPlayedCards.every(c => c.rank === lbTargetRank);
                loserIsMe = allMatch; // 我揭穿失败→我受罚
                iStartNext = !allMatch; // 骗子输了→赢家先出
                document.getElementById("lbMessage").textContent = allMatch
                    ? "对方说真话！你被水枪瞄准..." : "对方在骗人！TA被水枪瞄准...";
            } else {
                lbShowMyPlayedRevealed();
                allMatch = lbMyPlayedCards.every(c => c.rank === lbTargetRank);
                loserIsMe = !allMatch; // 我撒谎→我受罚
                iStartNext = allMatch; // 我说真话→我先出
                document.getElementById("lbMessage").textContent = allMatch
                    ? "我说了真话！对方被水枪瞄准..." : "我撒谎了！我被水枪瞄准...";
            }
            lbMyPlayedCards = [];
            document.getElementById("lbActions").innerHTML = `<span class="text-gray-400 text-sm py-2">🔫 等待扣扳机...</span>`;

            // 输的人扣扳机
            if (loserIsMe) {
                setTimeout(() => {
                    const hit = lbChamber === lbBulletPos;
                    lbChannel.send({ type: "broadcast", event: "trigger", payload: { from: myRpsEmail, chamber: lbChamber, hit } });
                    lbShowTriggerAnim(hit, true);
                }, 1200);
            }
            // 对方输时，等待对方的 trigger 广播
        }

        function lbShowTriggerAnim(hit, isMe) {
            const msg = document.getElementById("lbMessage");
            const actions = document.getElementById("lbActions");
            if (hit) {
                // 射中！掉1血
                if (isMe) { lbMyHP--; } else { lbPartnerHP--; }
                lbUpdateHP();
                msg.innerHTML = `💥 <span class="text-blue-500 font-bold">滋！被水枪射中了！</span> 掉1血`;
                actions.innerHTML = `<span class="text-4xl">🔫💦</span>`;
                sfxWaterHit();
                // 重置弹巢
                lbBulletPos = Math.floor(Math.random() * 6) + 1;
                lbChamber = 1;
                lbChannel.send({ type: "broadcast", event: "revolver", payload: { bullet: lbBulletPos, from: myRpsEmail } });
            } else {
                // 没射中
                lbChamber++;
                msg.innerHTML = `😤 <span class="text-gray-500">咔！空弹，逃过一劫~</span>`;
                actions.innerHTML = `<span class="text-4xl">🔫</span>`;
                sfxEmptyClick();
            }
            // 检查游戏结束
            if (lbMyHP <= 0 || lbPartnerHP <= 0) {
                setTimeout(() => {
                    const iWon = lbPartnerHP <= 0;
                    lbChannel.send({ type: "broadcast", event: "gameOver", payload: { from: myRpsEmail } });
                    lbPhase = "gameOver";
                    document.getElementById("lbMessage").textContent = iWon ? "你赢了！🎉" : "你输了 💔";
                    const a = document.getElementById("lbActions");
                    a.innerHTML = "";
                    const btn = lbEnsureStartBtn();
                    btn.textContent = "再来一局";
                    btn.onclick = lbStart;
                    btn.classList.remove("hidden");
                    btn.disabled = false;
                    a.appendChild(btn);
                }, 1500);
            } else {
                // 被惩罚的人下一轮先发（赢的人下一轮后手）
                const iStartNext = isMe ? true : false;
                // 只有受罚方（本地扣扳机）调用 lbNewRound 并广播，另一方通过 newRound 广播接收
                if (isMe) {
                    setTimeout(() => lbNewRound(iStartNext), 2500);
                }
            }
        }

        function lbShowMyPlayedRevealed() {
            // 在对手出牌区域展示我出的牌（翻面）
            const wrap = document.getElementById("lbPartnerPlayed");
            wrap.innerHTML = '<span class="text-xs text-gray-400 mr-2">我的牌:</span>';
            lbMyPlayedCards.forEach(c => {

                const isRed = lbRedSuits.includes(c.suit);

                div.innerHTML = `<span>${c.suit}</span><span>${c.rank}</span>`;
                wrap.appendChild(div);

        function lbNewRound(iStart) {
            lbTargetRank = lbRanks[Math.floor(Math.random() * lbRanks.length)];
            lbMyTurn = iStart;
            lbPartnerPlayedCards = [];
            lbSelected = [];
            // 重新发牌（每人5张，保证至少一张目标牌型）
            lbMyCards = lbDealCardsWithTarget(5, lbTargetRank);

            lbRenderHand();
            lbRenderPartnerPlayed(false);

        function lbUpdateHP() {
            document.getElementById("lbMyHP").textContent = lbMyHP > 0 ? "💧" : "🫧";
            document.getElementById("lbPartnerHP").textContent = lbPartnerHP > 0 ? "💧" : "🫧";

        // 获取/重建开始按钮（lbShow* 函数会用 innerHTML 清空 lbActions，导致按钮从 DOM 移除）

        function lbShowPlayButtons() {

        function lbShowRespondButtons() {
            const a = document.getElementById("lbActions");
            a.innerHTML = `
                <button onclick="lbCall()" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-full transition">揭穿！</button>
                <button onclick="lbBelieve()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-2 rounded-full transition">相信</button>`;
        }
        function lbShowWaitButtons() {
            document.getElementById("lbActions").innerHTML = `<span class="text-gray-400 text-sm py-2">等待对方...</span>`;
        }

        // ==================== 音效与 BGM ====================
        let audioCtx = null;
        let bgmPlaying = false;
        let bgmTimer = null;
        let bgmGain = null;
        let bgmNoteIndex = 0;
        let bgmBassIndex = 0;
        let bgmNextNoteTime = 0;
        let bgmNextBassTime = 0;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                bgmGain = audioCtx.createGain();
                bgmGain.gain.value = 0.12;
                bgmGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === "suspended") audioCtx.resume();
        }

        // BGM 旋律（温柔的八音盒风格）
        const bgmMelody = [
            [523.25, 0.4], [659.25, 0.4], [783.99, 0.4], [1046.5, 0.6],
            [783.99, 0.4], [659.25, 0.4], [587.33, 0.4], [659.25, 0.6],
            [523.25, 0.4], [587.33, 0.4], [659.25, 0.4], [880.0, 0.6],
            [783.99, 0.4], [659.25, 0.4], [587.33, 0.4], [523.25, 0.8],
        ];
        const bgmBass = [
            [130.81, 1.6], [196.0, 1.6], [174.61, 1.6], [130.81, 1.6],
        ];

        function playBgmNote(freq, time, duration, gainNode, type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type || "triangle";
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, time);
            gain.gain.linearRampToValueAtTime(0.3, time + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.01, time + duration);
            osc.connect(gain);
            gain.connect(gainNode);
            osc.start(time);
            osc.stop(time + duration);
        }

        function scheduleBgm() {
            if (!bgmPlaying) return;
            const now = audioCtx.currentTime;
            while (bgmNextNoteTime < now + 0.5) {
                const [freq, dur] = bgmMelody[bgmNoteIndex % bgmMelody.length];
                playBgmNote(freq, bgmNextNoteTime, dur, bgmGain, "triangle");
                bgmNextNoteTime += dur;
                bgmNoteIndex++;
            }
            while (bgmNextBassTime < now + 0.5) {
                const [freq, dur] = bgmBass[bgmBassIndex % bgmBass.length];
                playBgmNote(freq, bgmNextBassTime, dur, bgmGain, "sine");
                bgmNextBassTime += dur;
                bgmBassIndex++;
            }
            bgmTimer = setTimeout(scheduleBgm, 100);
        }

        function toggleBgm() {
            initAudio();
            const btn = document.getElementById("bgmToggle");
            if (!bgmPlaying) {
                bgmPlaying = true;
                bgmNoteIndex = 0;
                bgmBassIndex = 0;
                bgmNextNoteTime = audioCtx.currentTime + 0.1;
                bgmNextBassTime = audioCtx.currentTime + 0.1;
                scheduleBgm();
                btn.querySelector("i").className = "fa fa-volume-up";
                btn.classList.add("playing");
            } else {
                bgmPlaying = false;
                clearTimeout(bgmTimer);
                btn.querySelector("i").className = "fa fa-volume-off";
                btn.classList.remove("playing");
            }
        }

        // 音效：水枪射中
        function sfxWaterHit() {
            initAudio();
            const now = audioCtx.currentTime;
            // 噪声水花
            const bufferSize = audioCtx.sampleRate * 0.3;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = "bandpass";
            noiseFilter.frequency.setValueAtTime(2000, now);
            noiseFilter.frequency.exponentialRampToValueAtTime(200, now + 0.3);
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.4, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noise.start(now);
            // 频率下滑（"滋"声）
            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(150, now + 0.2);
            oscGain.gain.setValueAtTime(0.25, now);
            oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.connect(oscGain);
            oscGain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.2);
        }

        // 音效：空弹咔嗒
        function sfxEmptyClick() {
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "square";
            osc.frequency.setValueAtTime(1200, now);
            osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.08);
        }

        // 音效：出牌
        function sfxPlay() {
            initAudio();
            const now = audioCtx.currentTime;
            const bufferSize = audioCtx.sampleRate * 0.12;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 1.5);
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = "highpass";
            filter.frequency.value = 1000;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start(now);
        }

        // ==================== 音乐播放器 ====================
        let musicList = [];
        let currentMusicIndex = -1;

        function toggleMusicPanel() {
            const panel = document.getElementById("musicPanel");
            panel.classList.toggle("hidden-panel");
        }

        async function loadMusicList() {
            const { data } = await sb.from("music").select("*").order("created_at", { ascending: false });
            musicList = data || [];
            const listEl = document.getElementById("musicList");
            listEl.innerHTML = "";
            if (musicList.length === 0) {
                listEl.innerHTML = `<div class="text-center text-gray-400 py-2 text-xs">暂无歌曲，上传一首吧</div>`;
                return;
            }
            musicList.forEach((item, idx) => {
                const div = document.createElement("div");
                div.className = "music-item" + (idx === currentMusicIndex ? " active" : "");
                div.innerHTML = `
                    <span onclick="playMusic(${idx})">${item.title || "未知歌曲"}</span>
                    <span class="del" onclick="deleteMusic('${item.id}')"><i class="fa fa-trash"></i></span>
                `;
                listEl.appendChild(div);
            });
        }

        async function uploadMusic(e) {
            const file = e.target.files[0];
            if (!file) return;
            const title = file.name.replace(/\.[^/.]+$/, "");
            const { data, error } = await sb.storage.from("music").upload(`${Date.now()}_${file.name}`, file);
            if (error) {
                alert("上传失败：" + error.message);
                return;
            }
            const url = sb.storage.from("music").getPublicUrl(data.path).data.publicUrl;
            await sb.from("music").insert({ title, url });
            e.target.value = "";
            loadMusicList();
        }

        async function deleteMusic(id) {
            if (!confirm("确定删除这首歌？")) return;
            await sb.from("music").delete().eq("id", id);
            loadMusicList();
        }

        function playMusic(index) {
            if (index < 0 || index >= musicList.length) return;
            currentMusicIndex = index;
            const item = musicList[index];
            const audio = document.getElementById("musicAudio");
            audio.src = item.url;
            audio.play();
            document.getElementById("musicTitle").innerText = item.title;
            document.getElementById("musicCover").classList.add("playing");
            document.getElementById("musicToggle").classList.add("playing");
            document.getElementById("musicPlayBtn").innerHTML = '<i class="fa fa-pause"></i>';
            loadMusicList();
        }

        function togglePlay() {
            const audio = document.getElementById("musicAudio");
            if (currentMusicIndex === -1) {
                if (musicList.length > 0) playMusic(0);
                return;
            }
            if (audio.paused) {
                audio.play();
                document.getElementById("musicCover").classList.add("playing");
                document.getElementById("musicToggle").classList.add("playing");
                document.getElementById("musicPlayBtn").innerHTML = '<i class="fa fa-pause"></i>';
            } else {
                audio.pause();
                document.getElementById("musicCover").classList.remove("playing");
                document.getElementById("musicToggle").classList.remove("playing");
                document.getElementById("musicPlayBtn").innerHTML = '<i class="fa fa-play"></i>';
            }
        }

        function prevMusic() {
            if (musicList.length === 0) return;
            const idx = currentMusicIndex <= 0 ? musicList.length - 1 : currentMusicIndex - 1;
            playMusic(idx);
        }

        function nextMusic() {
            if (musicList.length === 0) return;
            const idx = currentMusicIndex >= musicList.length - 1 ? 0 : currentMusicIndex + 1;
            playMusic(idx);
        }

        function updateProgress() {
            const audio = document.getElementById("musicAudio");
            if (!audio.duration) return;
            const percent = (audio.currentTime / audio.duration) * 100;
            document.getElementById("musicProgressBar").style.width = percent + "%";
            document.getElementById("musicCurrent").innerText = formatTime(audio.currentTime);
            document.getElementById("musicDuration").innerText = formatTime(audio.duration);
        }

        function seekMusic(e) {
            const audio = document.getElementById("musicAudio");
            if (!audio.duration) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        }

        function onMusicEnded() {
            nextMusic();
        }

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${String(sec).padStart(2, '0')}`;
        }

        // ==================== 哈士奇宠物 ====================
        const huskyPhrases = ["汪汪！", "陪我玩嘛~", "摸摸我！", "好开心！", "汪~", "爱你哟", "今天也元气满满！", "主人最好了"];
        let huskyWalkingTimer = null;
        let huskyDragging = false;

        function initHusky() {
            document.getElementById("huskyPet").classList.remove("hidden");
            startHuskyWalking();
        }

        function startHuskyWalking() {
            if (huskyWalkingTimer) clearInterval(huskyWalkingTimer);
            huskyWalkingTimer = setInterval(() => {
                if (huskyDragging) return;
                const pet = document.getElementById("huskyPet");
                const curLeft = parseInt(pet.style.left) || 20;
                const move = Math.random() > 0.5 ? 30 : -30;
                let newLeft = curLeft + move;
                newLeft = Math.max(10, Math.min(window.innerWidth - 110, newLeft));
                pet.style.left = newLeft + "px";
                pet.classList.add("walking");
                pet.style.transform = move < 0 ? "scaleX(-1)" : "scaleX(1)";
                setTimeout(() => pet.classList.remove("walking"), 2000);
            }, 8000);
        }

        function petHusky() {
            if (huskyDragging) return;
            const pet = document.getElementById("huskyPet");
            pet.classList.add("happy");
            setTimeout(() => pet.classList.remove("happy"), 500);

            // 随机对话
            const bubble = document.getElementById("huskyBubble");
            bubble.innerText = huskyPhrases[Math.floor(Math.random() * huskyPhrases.length)];
            bubble.classList.add("show");
            setTimeout(() => bubble.classList.remove("show"), 2000);

            // 吐舌头
            const tongue = document.getElementById("huskyTongue");
            tongue.style.display = "block";
            setTimeout(() => tongue.style.display = "none", 1500);

            // 冒爱心
            for (let i = 0; i < 3; i++) {
                setTimeout(() => spawnHuskyHeart(), i * 150);
            }
        }

        function spawnHuskyHeart() {
            const pet = document.getElementById("huskyPet");
            const heart = document.createElement("i");
            heart.className = "fa fa-heart husky-heart";
            heart.style.left = (40 + Math.random() * 20) + "px";
            heart.style.top = "20px";
            heart.style.setProperty("--dx", (Math.random() * 60 - 30) + "px");
            heart.style.animation = "heart-float 1.2s ease-out forwards";
            pet.appendChild(heart);
            setTimeout(() => heart.remove(), 1200);
        }

        // 拖拽
        function startDragHusky(e) {
            const pet = document.getElementById("huskyPet");
            const rect = pet.getBoundingClientRect();
            const isTouch = !!e.touches;
            const point = isTouch ? e.touches[0] : e;
            const startX = point.clientX;
            const startY = point.clientY;
            const offsetX = point.clientX - rect.left;
            const offsetY = point.clientY - rect.top;
            let hasMoved = false;
            pet.style.transition = "none";

            function onMove(ev) {
                const pt = ev.touches ? ev.touches[0] : ev;
                if (ev.touches) ev.preventDefault();
                const dx = pt.clientX - startX;
                const dy = pt.clientY - startY;
                if (!hasMoved && Math.abs(dx) + Math.abs(dy) > 5) {
                    hasMoved = true;
                    huskyDragging = true;
                }
                if (!hasMoved) return;
                let x = pt.clientX - offsetX;
                let y = pt.clientY - offsetY;
                x = Math.max(0, Math.min(window.innerWidth - pet.offsetWidth, x));
                y = Math.max(0, Math.min(window.innerHeight - pet.offsetHeight, y));
                pet.style.left = x + "px";
                pet.style.top = y + "px";
                pet.style.bottom = "auto";
                pet.style.transform = "scaleX(1)";
            }
            function onUp() {
                huskyDragging = false;
                pet.style.transition = "";
                document.removeEventListener("mousemove", onMove);
                document.removeEventListener("mouseup", onUp);
                document.removeEventListener("touchmove", onMove);
                document.removeEventListener("touchend", onUp);
                if (!hasMoved) petHusky();
            }
            if (isTouch) e.preventDefault();
            document.addEventListener("mousemove", onMove);
            document.addEventListener("mouseup", onUp);
            document.addEventListener("touchmove", onMove, { passive: false });
            document.addEventListener("touchend", onUp);
        }

        // ==================== 暹罗猫宠物 ====================
        const catPhrases = ["喵~", "呼噜呼噜", "别摸我！", "喵喵喵！", "本喵饿了", "喜欢你", "蹭蹭你", "喵呜~"];
        let catWalkingTimer = null;
        let catDragging = false;

        function initCat() {
            document.getElementById("catPet").classList.remove("hidden");
            startCatWalking();
        }

        function startCatWalking() {
            if (catWalkingTimer) clearInterval(catWalkingTimer);
            catWalkingTimer = setInterval(() => {
                if (catDragging) return;
                const pet = document.getElementById("catPet");
                const curRight = window.innerWidth - (parseInt(pet.style.right) || 20) - 100;
                const move = Math.random() > 0.5 ? 30 : -30;
                let newRight = (parseInt(pet.style.right) || 20) - move;
                newRight = Math.max(10, Math.min(window.innerWidth - 110, newRight));
                pet.style.right = newRight + "px";
                pet.classList.add("walking");
                pet.style.transform = move > 0 ? "scaleX(-1)" : "scaleX(1)";
                setTimeout(() => pet.classList.remove("walking"), 2000);
            }, 9000);
        }

        function petCat() {
            if (catDragging) return;
            const pet = document.getElementById("catPet");
            pet.classList.add("happy");
            setTimeout(() => pet.classList.remove("happy"), 500);

            const bubble = document.getElementById("catBubble");
            bubble.innerText = catPhrases[Math.floor(Math.random() * catPhrases.length)];
            bubble.classList.add("show");
            setTimeout(() => bubble.classList.remove("show"), 2000);

            const tongue = document.getElementById("catTongue");
            tongue.style.display = "block";
            setTimeout(() => tongue.style.display = "none", 1500);

            for (let i = 0; i < 3; i++) {
                setTimeout(() => spawnCatHeart(), i * 150);
            }
        }

        function spawnCatHeart() {
            const pet = document.getElementById("catPet");
            const heart = document.createElement("i");
            heart.className = "fa fa-heart husky-heart";
            heart.style.color = "#a78bfa";
            heart.style.left = (40 + Math.random() * 20) + "px";
            heart.style.top = "20px";
            heart.style.setProperty("--dx", (Math.random() * 60 - 30) + "px");
            heart.style.animation = "heart-float 1.2s ease-out forwards";
            pet.appendChild(heart);
            setTimeout(() => heart.remove(), 1200);
        }

        function startDragCat(e) {
            const pet = document.getElementById("catPet");
            const rect = pet.getBoundingClientRect();
            const isTouch = !!e.touches;
            const point = isTouch ? e.touches[0] : e;
            const startX = point.clientX;
            const startY = point.clientY;
            const offsetX = point.clientX - rect.left;
            const offsetY = point.clientY - rect.top;
            let hasMoved = false;
            pet.style.transition = "none";

            function onMove(ev) {
                const pt = ev.touches ? ev.touches[0] : ev;
                if (ev.touches) ev.preventDefault();
                const dx = pt.clientX - startX;
                const dy = pt.clientY - startY;
                if (!hasMoved && Math.abs(dx) + Math.abs(dy) > 5) {
                    hasMoved = true;
                    catDragging = true;
                }
                if (!hasMoved) return;
                let x = pt.clientX - offsetX;
                let y = pt.clientY - offsetY;
                x = Math.max(0, Math.min(window.innerWidth - pet.offsetWidth, x));
                y = Math.max(0, Math.min(window.innerHeight - pet.offsetHeight, y));
                pet.style.left = x + "px";
                pet.style.top = y + "px";
                pet.style.right = "auto";
                pet.style.bottom = "auto";
                pet.style.transform = "scaleX(1)";
            }
            function onUp() {
                catDragging = false;
                pet.style.transition = "";
                document.removeEventListener("mousemove", onMove);
                document.removeEventListener("mouseup", onUp);
                document.removeEventListener("touchmove", onMove);
                document.removeEventListener("touchend", onUp);
                if (!hasMoved) petCat();
            }
            if (isTouch) e.preventDefault();
            document.addEventListener("mousemove", onMove);
            document.addEventListener("mouseup", onUp);
            document.addEventListener("touchmove", onMove, { passive: false });
            document.addEventListener("touchend", onUp);
        }
    </script>
</body>
