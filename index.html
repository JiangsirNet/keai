<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的情侣空间</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.11/lunar.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        love: '#ff6b8b',
                        loveDark: '#e04c6e'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="heartBox"></div>

    <!-- 男生 Live2D 风格互动形象 -->
    <div id="boyPet" class="boy-pet hidden" onmousedown="startDragBoy(event)" ontouchstart="startDragBoy(event)">
        <div class="boy-bubble" id="boyBubble"></div>
        <canvas id="boyCanvas" width="240" height="320"></canvas>
    </div>

    <!-- 女生 Live2D 风格互动形象 -->
    <div id="girlPet" class="girl-pet hidden" onmousedown="startDragGirl(event)" ontouchstart="startDragGirl(event)">
        <div class="girl-bubble" id="girlBubble"></div>
        <canvas id="girlCanvas" width="240" height="320"></canvas>
    </div>

    <!-- 哈士奇宠物 -->
    <div id="huskyPet" class="husky-pet hidden" onclick="petHusky()" onmousedown="startDragHusky(event)" ontouchstart="startDragHusky(event)">
        <div class="husky-bubble" id="huskyBubble"></div>
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path class="husky-tail" d="M70 65 Q82 55 80 42" stroke="#5a6b7a" stroke-width="6" fill="none" stroke-linecap="round"/>
            <ellipse cx="55" cy="62" rx="22" ry="16" fill="#dfe7ee"/>
            <rect x="40" y="68" width="7" height="18" rx="3" fill="#5a6b7a"/>
            <rect x="50" y="68" width="7" height="18" rx="3" fill="#c8d3dc"/>
            <rect x="60" y="68" width="7" height="18" rx="3" fill="#5a6b7a"/>
            <rect x="70" y="68" width="7" height="18" rx="3" fill="#c8d3dc"/>
            <circle cx="35" cy="42" r="18" fill="#dfe7ee"/>
            <path class="husky-ear-l" d="M25 28 L22 16 L32 24 Z" fill="#5a6b7a"/>
            <path d="M45 28 L48 16 L38 24 Z" fill="#5a6b7a"/>
            <path d="M35 30 L30 42 L35 50 L40 42 Z" fill="white"/>
            <circle cx="29" cy="40" r="3" fill="#1a1a2e"/>
            <circle cx="30" cy="39" r="1" fill="white"/>
            <circle cx="41" cy="40" r="3" fill="#1a1a2e"/>
            <circle cx="42" cy="39" r="1" fill="white"/>
            <ellipse cx="35" cy="47" rx="3" ry="2" fill="#1a1a2e"/>
            <path id="huskyMouth" d="M35 49 Q35 53 32 53 M35 49 Q35 53 38 53" stroke="#1a1a2e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            <ellipse id="huskyTongue" cx="35" cy="54" rx="3" ry="4" fill="#ff6b8b" style="display:none"/>
        </svg>
    </div>

    <!-- 暹罗猫宠物 -->
    <div id="catPet" class="cat-pet hidden" onclick="petCat()" onmousedown="startDragCat(event)" ontouchstart="startDragCat(event)">
        <div class="cat-bubble" id="catBubble"></div>
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path class="cat-tail" d="M72 58 Q88 48 82 30" stroke="#6b5444" stroke-width="5" fill="none" stroke-linecap="round"/>
            <ellipse cx="55" cy="60" rx="20" ry="15" fill="#f0e6dc"/>
            <rect x="42" y="66" width="6" height="18" rx="3" fill="#6b5444"/>
            <rect x="50" y="66" width="6" height="18" rx="3" fill="#f0e6dc"/>
            <rect x="60" y="66" width="6" height="18" rx="3" fill="#6b5444"/>
            <rect x="68" y="66" width="6" height="18" rx="3" fill="#f0e6dc"/>
            <circle cx="35" cy="42" r="17" fill="#f0e6dc"/>
            <ellipse cx="35" cy="44" rx="13" ry="11" fill="#6b5444"/>
            <path class="cat-ear-l" d="M22 30 L18 14 L30 24 Z" fill="#6b5444"/>
            <path d="M24 27 L22 18 L28 24 Z" fill="#f0b8c0"/>
            <path d="M48 30 L52 14 L40 24 Z" fill="#6b5444"/>
            <path d="M46 27 L48 18 L42 24 Z" fill="#f0b8c0"/>
            <ellipse cx="29" cy="42" rx="3.5" ry="3" fill="#4fc3f7"/>
            <ellipse cx="29" cy="42" rx="1.5" ry="2.5" fill="#1a1a2e"/>
            <circle cx="30" cy="41" r="0.8" fill="white"/>
            <ellipse cx="41" cy="42" rx="3.5" ry="3" fill="#4fc3f7"/>
            <ellipse cx="41" cy="42" rx="1.5" ry="2.5" fill="#1a1a2e"/>
            <circle cx="42" cy="41" r="0.8" fill="white"/>
            <path d="M33 47 L37 47 L35 49 Z" fill="#f0b8c0"/>
            <path id="catMouth" d="M35 49 Q35 52 32 52 M35 49 Q35 52 38 52" stroke="#3a2a1e" stroke-width="1.2" fill="none" stroke-linecap="round"/>
            <line x1="20" y1="46" x2="12" y2="44" stroke="#3a2a1e" stroke-width="0.8"/>
            <line x1="20" y1="48" x2="12" y2="49" stroke="#3a2a1e" stroke-width="0.8"/>
            <line x1="50" y1="46" x2="58" y2="44" stroke="#3a2a1e" stroke-width="0.8"/>
            <line x1="50" y1="48" x2="58" y2="49" stroke="#3a2a1e" stroke-width="0.8"/>
            <ellipse id="catTongue" cx="35" cy="53" rx="2.5" ry="3.5" fill="#ff9ec4" style="display:none"/>
        </svg>
    </div>

    <!-- 下拉刷新指示器 -->
    <div id="pullRefreshIndicator" class="pull-refresh-indicator">
        <i class="fa fa-arrow-down" id="pullRefreshIcon"></i>
        <span id="pullRefreshText">下拉刷新</span>
    </div>

    <!-- 天气组件（左上角）-->
    <div id="weatherWidget" class="weather-widget hidden" onclick="showWeatherDetail()">
        <span class="w-icon" id="wIcon">⏳</span>
        <span class="w-temp" id="wTemp">--</span>
        <span class="w-city" id="wCity">定位中</span>
    </div>

    <!-- 音乐播放器 -->
    <button id="musicToggle" class="music-toggle hidden" onclick="toggleMusicPanel()">
        <i class="fa fa-music"></i>
    </button>

    <!-- 通知铃铛 -->
    <button id="bellToggle" class="bell-toggle hidden" onclick="toggleBellPanel()">
        <i class="fa fa-bell"></i>
        <span class="bell-badge hidden" id="bellBadge">0</span>
    </button>
    <div id="bellPanel" class="bell-panel hidden">
        <div class="bell-panel-header">
            <span>消息通知</span>
            <button onclick="clearAllNotifications()" class="bell-clear-btn">清空</button>
        </div>
        <div id="bellList" class="bell-list">
            <div class="text-center text-gray-400 py-4 text-xs">暂无通知</div>
        </div>
    </div>
    <div id="musicPanel" class="music-panel hidden-panel">
        <div class="music-cover" id="musicCover"><i class="fa fa-music"></i></div>
        <div class="music-title" id="musicTitle">暂无歌曲</div>
        <div class="music-progress" id="musicProgress" onclick="seekMusic(event)">
            <div class="music-progress-bar" id="musicProgressBar"></div>
        </div>
        <div class="music-time">
            <span id="musicCurrent">0:00</span>
            <span id="musicDuration">0:00</span>
        </div>
        <div class="music-controls">
            <button class="music-btn" onclick="prevMusic()"><i class="fa fa-step-backward"></i></button>
            <button class="music-btn play" id="musicPlayBtn" onclick="togglePlay()">
                <i class="fa fa-play"></i>
            </button>
            <button class="music-btn" onclick="nextMusic()"><i class="fa fa-step-forward"></i></button>
        </div>
        <div class="music-list" id="musicList">
            <div class="text-center text-gray-400 py-2 text-xs">暂无歌曲</div>
        </div>
        <div style="display:flex;gap:4px;justify-content:center;margin-top:6px;">
            <button class="music-sort-btn" onclick="changeMusicSort('date_desc')" id="sortDateDesc">最新上传</button>
            <button class="music-sort-btn" onclick="changeMusicSort('date_asc')" id="sortDateAsc">最早上传</button>
            <button class="music-sort-btn" onclick="changeMusicSort('title_asc')" id="sortTitleAsc">歌名A-Z</button>
            <button class="music-sort-btn" onclick="changeMusicSort('title_desc')" id="sortTitleDesc">歌名Z-A</button>
        </div>
        <label class="music-upload">
            <i class="fa fa-upload"></i> 上传歌曲
            <input type="file" id="musicUpload" accept="audio/*" class="hidden" onchange="uploadMusic(event)">
        </label>
        <audio id="musicAudio" ontimeupdate="updateProgress()" onended="onMusicEnded()"></audio>
    </div>

    <!-- ===== 以下内容由 loader.js 动态加载 ===== -->

    <!-- 登录面板 -->
    <div id="loginPanelContainer"></div>

    <!-- 大图预览弹窗 -->
    <div id="previewModalContainer"></div>

    <!-- 主页面 -->
    <div id="mainPage" class="container max-w-4xl mx-auto px-4 py-8 md:py-12 hidden">
        <!-- 导航栏 -->
        <nav class="nav-bar">
            <button class="nav-btn active" onclick="showPage('home')">
                <span class="nav-icon">🏠</span> 首页
            </button>
            <button class="nav-btn" onclick="showPage('journal')">
                <span class="nav-icon">📖</span> 日志
            </button>
            <button class="nav-btn" onclick="showPage('game')">
                <span class="nav-icon">🎮</span> 游戏
            </button>
            <button class="nav-btn" onclick="showPage('config')">
                <span class="nav-icon">⚙️</span> 设置
            </button>
        </nav>

        <!-- 各页面内容由 loader.js 注入 -->
        <div id="pageHomeContainer"></div>
        <div id="pageJournalContainer"></div>
        <div id="pageGameContainer"></div>
        <div id="pageConfigContainer"></div>

        <div class="text-center mt-10 text-gray-500 text-sm">
            <p>Made with <i class="fa fa-heart text-love"></i> 只属于我们两个人的小天地</p>
        </div>
    </div>

    <!-- 本地核心脚本：config.js（Supabase连接）→ loader.js（从数据库加载其余资源） -->
    <script src="js/config.js"></script>
    <script src="js/loader.js"></script>
</body>

</html>
