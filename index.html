<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的情侣空间</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        love: '#ff6b8b',
                        loveDark: '#e04c6e'
                    }
                }
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ffe6ec, #fff0f4);
            min-height: 100vh;
            font-family: "Microsoft Yahei", sans-serif;
            overflow-x: hidden;
        }

        .heart {
            position: fixed;
            color: #ff6b8b;
            opacity: 0.7;
            animation: fall linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10px) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            90% {
                opacity: 0.7;
            }

            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 1;
        }

        .card-shadow {
            box-shadow: 0 8px 30px rgba(255, 107, 139, 0.18);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #ffb4c4;
            border-radius: 10px;
        }

        .loading {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.5
            }

            50% {
                opacity: 1
            }
        }

        .img-preview-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .img-preview-modal img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 12px;
        }

        .hidden {
            display: none !important;
        }

        .img-loading {
            background: #fde8ee;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            border-radius: 12px;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #ffd0db;
            border-top-color: #ff6b8b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .img-card img {
            transition: opacity 0.3s ease;
        }

        .img-card img.loading {
            opacity: 0;
        }

        .img-card img.loaded {
            opacity: 1;
        }

        .journal-item {
            transition: all 0.2s ease;
        }

        .journal-item:hover {
            transform: translateX(2px);
        }

        /* 音乐播放器 */
        .music-panel {
            position: fixed;
            top: 70px;
            right: 20px;
            z-index: 100;
            width: 280px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 10px 40px rgba(255, 107, 139, 0.25);
            border: 1px solid #ffe0e8;
        }

        .music-panel.hidden-panel {
            display: none;
        }

        .music-cover {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b8b, #ffb4c4);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            animation: rotate 8s linear infinite;
            animation-play-state: paused;
        }

        .music-cover.playing {
            animation-play-state: running;
        }

        .music-cover i {
            font-size: 32px;
            color: white;
        }

        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        .music-title {
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-progress {
            height: 4px;
            background: #ffe0e8;
            border-radius: 2px;
            cursor: pointer;
            margin-bottom: 10px;
            position: relative;
        }

        .music-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff6b8b, #ffb4c4);
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .music-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
        }

        .music-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: #fde8ee;
            color: #ff6b8b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .music-btn:hover {
            background: #ff6b8b;
            color: white;
        }

        .music-btn.play {
            width: 44px;
            height: 44px;
            background: #ff6b8b;
            color: white;
        }

        .music-btn.play:hover {
            background: #e04c6e;
        }

        .music-time {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #999;
            margin-bottom: 10px;
        }

        .music-list {
            max-height: 120px;
            overflow-y: auto;
            border-top: 1px solid #ffe0e8;
            padding-top: 8px;
        }

        .music-item {
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #555;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .music-item:hover {
            background: #fde8ee;
        }

        .music-item.active {
            background: #ff6b8b;
            color: white;
        }

        .music-item .del {
            opacity: 0;
            font-size: 12px;
        }

        .music-item:hover .del {
            opacity: 1;
        }

        .music-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 99;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b8b, #ffb4c4);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 139, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: transform 0.3s;
        }

        .music-toggle:hover {
            transform: scale(1.1);
        }

        .music-toggle.playing {
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 4px 15px rgba(255, 107, 139, 0.4); }
            50% { box-shadow: 0 4px 25px rgba(255, 107, 139, 0.7); }
        }

        .music-upload {
            font-size: 11px;
            color: #ff6b8b;
            cursor: pointer;
            text-align: center;
            margin-top: 8px;
            display: block;
        }

        .music-upload:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div id="heartBox"></div>

    <!-- 音乐播放器 -->
    <button id="musicToggle" class="music-toggle hidden" onclick="toggleMusicPanel()">
        <i class="fa fa-music"></i>
    </button>
    <div id="musicPanel" class="music-panel hidden-panel">
        <div class="music-cover" id="musicCover"><i class="fa fa-music"></i></div>
        <div class="music-title" id="musicTitle">暂无歌曲</div>
        <div class="music-progress" id="musicProgress" onclick="seekMusic(event)">
            <div class="music-progress-bar" id="musicProgressBar"></div>
        </div>
        <div class="music-time">
            <span id="musicCurrent">0:00</span>
            <span id="musicDuration">0:00</span>
        </div>
        <div class="music-controls">
            <button class="music-btn" onclick="prevMusic()"><i class="fa fa-step-backward"></i></button>
            <button class="music-btn play" id="musicPlayBtn" onclick="togglePlay()">
                <i class="fa fa-play"></i>
            </button>
            <button class="music-btn" onclick="nextMusic()"><i class="fa fa-step-forward"></i></button>
        </div>
        <div class="music-list" id="musicList">
            <div class="text-center text-gray-400 py-2 text-xs">暂无歌曲</div>
        </div>
        <label class="music-upload">
            <i class="fa fa-upload"></i> 上传歌曲
            <input type="file" id="musicUpload" accept="audio/*" class="hidden" onchange="uploadMusic(event)">
        </label>
        <audio id="musicAudio" ontimeupdate="updateProgress()" onended="onMusicEnded()"></audio>
    </div>

    <!-- 登录面板 -->
    <div id="loginPanel" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center px-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm">
            <h3 class="text-xl font-bold text-love mb-4 text-center">🔐 登录情侣空间</h3>
            <input id="loginEmail" type="email" placeholder="邮箱"
                class="w-full border border-rose-200 rounded-xl p-3 mb-3 outline-none focus:border-love">
            <input id="loginPwd" type="password" placeholder="密码"
                class="w-full border border-rose-200 rounded-xl p-3 mb-4 outline-none focus:border-love">
            <button onclick="login()"
                class="w-full bg-love hover:bg-loveDark text-white py-3 rounded-xl transition-all">登录</button>
            <div class="mt-3 text-center">
                <button onclick="logout()" class="text-gray-500 text-sm">退出登录</button>
            </div>
        </div>
    </div>

    <!--大图预览弹窗-->
    <div id="previewModal" class="img-preview-modal hidden" onclick="closePreview()">
        <img id="previewImg" alt="大图预览">
        <span class="absolute top-5 right-5 text-white text-3xl cursor-pointer">&times;</span>
    </div>

    <div id="mainPage" class="container max-w-4xl mx-auto px-4 py-8 md:py-12 hidden">
        <div class="flex justify-end mb-4">
            <button onclick="logout()" class="px-3 py-1 bg-gray-200 rounded-lg text-sm">退出登录</button>
        </div>
        <div class="bg-white/80 backdrop-blur rounded-3xl p-6 md:p-10 card-shadow text-center mb-8">
            <h1 class="text-[clamp(1.8rem,5vw,2.8rem)] font-bold text-love mb-3">
                <span id="boy"></span>
                <i class="fa fa-heart mx-3 animate-pulse"></i>
                <span id="girl"></span>
            </h1>
            <p class="text-gray-600 text-lg">我们在一起的时光</p>
            <div class="mt-5 text-[clamp(1.5rem,4vw,2.2rem)] font-semibold text-loveDark" id="dayCount"></div>
            <p class="text-sm text-gray-500 mt-2">朝朝暮暮，岁岁年年</p>
        </div>

        <div class="grid md:grid-cols-2 gap-6">
            <!--相册模块 -->
            <div class="bg-white/80 backdrop-blur rounded-3xl p-6 card-shadow">
                <h2 class="text-xl font-bold text-love flex items-center mb-4">
                    <i class="fa fa-camera mr-2"></i>恋爱相册
                </h2>
                <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" class="hidden">
                <button id="uploadBtn" onclick="document.getElementById('fileInput').click()"
                    class="w-full border border-dashed border-love rounded-xl py-3 text-love mb-4 hover:bg-rose-50 transition">
                    <i class="fa fa-upload mr-1"></i>上传照片
                </button>
                <div id="galleryWrap" class="grid grid-cols-2 gap-3">
                    <div class="text-center text-gray-400 py-10 loading">加载相册...</div>
                </div>
            </div>

            <!--纪念日-->
            <div class="bg-white/80 backdrop-blur rounded-3xl p-6 card-shadow">
                <h2 class="text-xl font-bold text-love flex items-center mb-4">
                    <i class="fa fa-calendar mr-2"></i>重要纪念日
                </h2>
                <ul class="space-y-3 text-gray-700" id="memoList">
                    <div class="text-center text-gray-400 py-6 loading">加载中...</div>
                </ul>
                <div class="mt-4 pt-4 border-t border-rose-100">
                    <input id="memoTitle" placeholder="名称" class="w-full border border-rose-200 rounded-lg p-2 mb-2">
                    <input id="memoDate" type="date" class="w-full border border-rose-200 rounded-lg p-2 mb-2">
                    <button onclick="addMemorial()" class="w-full bg-love text-white py-2 rounded-lg">新增纪念日</button>
                </div>
            </div>

            <!--留言板-->
            <div class="md:col-span-2 bg-white/80 backdrop-blur rounded-3xl p-6 card-shadow">
                <h2 class="text-xl font-bold text-love flex items-center mb-4">
                    <i class="fa fa-comment mr-2"></i>留言
                </h2>
                <textarea id="msgInput"
                    class="w-full border border-rose-200 rounded-xl p-4 outline-none focus:border-love resize-none h-28"
                    placeholder="写下想对TA说的话..."></textarea>
                <button onclick="sendMessage()"
                    class="mt-3 bg-love hover:bg-loveDark text-white px-6 py-2 rounded-full transition-all">发送留言</button>
                <div class="mt-5 space-y-3" id="msgList">
                    <div class="text-center text-gray-400 py-6 loading">加载留言...</div>
                </div>
            </div>

            <!--日志模块-->
            <div class="md:col-span-2 bg-white/80 backdrop-blur rounded-3xl p-6 card-shadow">
                <h2 class="text-xl font-bold text-love flex items-center mb-4">
                    <i class="fa fa-book mr-2"></i>我们的日志
                </h2>
                <div class="flex gap-2 mb-3">
                    <input id="journalTitle" placeholder="标题（可选）"
                        class="flex-1 border border-rose-200 rounded-lg p-2 outline-none focus:border-love">
                    <input id="journalDate" type="date"
                        class="border border-rose-200 rounded-lg p-2 outline-none focus:border-love">
                </div>
                <textarea id="journalContent"
                    class="w-full border border-rose-200 rounded-xl p-4 outline-none focus:border-love resize-none h-32"
                    placeholder="记录今天的故事、心情、趣事..."></textarea>
                <button onclick="addJournal()"
                    class="mt-3 bg-love hover:bg-loveDark text-white px-6 py-2 rounded-full transition-all">
                    <i class="fa fa-pencil mr-1"></i>写下这一篇
                </button>
                <div class="mt-5 space-y-4 max-h-[500px] overflow-y-auto" id="journalList">
                    <div class="text-center text-gray-400 py-6 loading">加载日志...</div>
                </div>
            </div>
        </div>

        <div class="text-center mt-10 text-gray-500 text-sm">
            <p>Made with <i class="fa fa-heart text-love"></i> 只属于我们两个人的小天地</p>
        </div>
    </div>

    <script>
        // =====================【修改这里】=====================
        // 以下配置（除 SUPABASE_URL 和 SUPABASE_ANON_KEY 外）均从数据库 app_config 表读取
        const CONFIG = {
            SUPABASE_URL: "https://fccsjbvkfllapyoozuvf.supabase.co",
            SUPABASE_ANON_KEY: "sb_publishable_A3W8wYMbB-6pABB0-e0vkA_E-VMsJ4n",
            boyName: "他",
            girlName: "她",
            boyEmail: "",
            girlEmail: "",
            loveStart: new Date(2026, 5, 30)
        };
        // =====================================================

        const { createClient } = window.supabase;
        const sb = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
        let IMGBB_KEY = ""; // 运行登录后从数据库读取

        // 页面初始化，检测登录状态
        (async function initCheckAuth() {
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                document.getElementById("loginPanel").classList.add("hidden");
                await loadConfig();
                initPage();
            } else {
                document.getElementById("loginPanel").classList.remove("hidden");
            }
        })();

        // 登录
        async function login() {
            const email = document.getElementById("loginEmail").value.trim();
            const pwd = document.getElementById("loginPwd").value.trim();
            if (!email || !pwd) return alert("请填写邮箱和密码");
            const { error } = await sb.auth.signInWithPassword({ email, password: pwd });
            if (error) {
                alert("登录失败：" + error.message);
                return;
            }
            document.getElementById("loginPanel").classList.add("hidden");
            await loadConfig();
            initPage();
        }

        // 退出登录
        async function logout() {
            await sb.auth.signOut();
            IMGBB_KEY = "";
            document.getElementById("mainPage").classList.add("hidden");
            document.getElementById("loginPanel").classList.remove("hidden");
            document.getElementById("musicToggle").classList.add("hidden");
            document.getElementById("musicPanel").classList.add("hidden-panel");
            document.getElementById("musicAudio").pause();
        }

        // 从数据库 app_config 表读取所有配置
        async function loadConfig() {
            const { data, error } = await sb.from("app_config").select("config_key, config_value");
            if (error) {
                console.warn("读取配置失败：", error.message);
                return false;
            }
            if (!data || data.length === 0) return true;
            const map = {};
            data.forEach(item => { map[item.config_key] = item.config_value; });
            if (map.boy_name) CONFIG.boyName = map.boy_name;
            if (map.girl_name) CONFIG.girlName = map.girl_name;
            if (map.boy_email) CONFIG.boyEmail = map.boy_email;
            if (map.girl_email) CONFIG.girlEmail = map.girl_email;
            if (map.love_start) CONFIG.loveStart = new Date(map.love_start);
            if (map.imgbb_api_key) IMGBB_KEY = map.imgbb_api_key;
            return true;
        }

        //大图预览
        function openPreview(imgSrc) {
            document.getElementById("previewImg").src = imgSrc;
            document.getElementById("previewModal").classList.remove("hidden");
        }
        function closePreview() {
            document.getElementById("previewModal").classList.add("hidden");
        }

        //页面业务初始化
        function initPage() {
            document.getElementById('boy').innerText = CONFIG.boyName;
            document.getElementById('girl').innerText = CONFIG.girlName;
            document.getElementById("mainPage").classList.remove("hidden");
            calcLoveDay();
            setInterval(calcLoveDay, 60000);
            createHeartLoop();
            loadGallery();
            loadMessages();
            loadMemorial();
            loadJournal();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById("journalDate").value = today;
            document.getElementById("fileInput").onchange = uploadImageToImgBB;
            document.getElementById("musicToggle").classList.remove("hidden");
            loadMusicList();
        }

        //相恋天数
        function calcLoveDay() {
            const now = new Date();
            const diff = now - CONFIG.loveStart;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('dayCount').innerText = `已经相爱 ${days} 天`;
        }

        //爱心飘落
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart fa fa-heart';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 16 + 8) + 'px';
            const duration = Math.random() * 6 + 4;
            heart.style.animationDuration = duration + 's';
            document.getElementById("heartBox").appendChild(heart);
            setTimeout(() => heart.remove(), duration * 1000);
        }
        function createHeartLoop() {
            setInterval(createHeart, 600);
        }

        // ImgBB上传
        async function uploadImageToImgBB(e) {
            const file = e.target.files[0];
            const uploadBtn = document.getElementById("uploadBtn");
            if (!file || !IMGBB_KEY) {
                alert("缺少ImgBB密钥，请重新登录");
                e.target.value = "";
                return;
            }

            const maxSize = 32 * 1024 * 1024;
            if (file.size > maxSize) {
                alert("图片不能超过32MB");
                e.target.value = "";
                return;
            }
            const allowType = ["image/jpeg", "image/png", "image/webp"];
            if (!allowType.includes(file.type)) {
                alert("仅支持jpg/png/webp");
                e.target.value = "";
                return;
            }

            uploadBtn.innerText = "上传中...";
            uploadBtn.disabled = true;

            try {
                const formData = new FormData();
                formData.append('image', file);
                formData.append('key', IMGBB_KEY);

                const res = await fetch(`https://api.imgbb.com/1/upload`, {
                    method: "POST",
                    body: formData
                });
                const result = await res.json();
                if (!result.success) throw new Error(result.error?.message || "上传失败");

                const imgUrl = result.data.url;
                const deleteUrl = result.data.delete_url;

                await sb.from("gallery").insert({ img_url: imgUrl, delete_url: deleteUrl });
                loadGallery();
            } catch (err) {
                console.error(err);
                alert("图片上传失败：" + err.message);
            } finally {
                uploadBtn.innerHTML = '<i class="fa fa-upload mr-1"></i>上传合照';
                uploadBtn.disabled = false;
                e.target.value = "";
            }
        }

        // 删除照片
        async function deletePhoto(id, deleteLink) {
            if (!confirm("确定删除照片？无法恢复！")) return;
            try {
                await fetch(deleteLink);
            } catch (e) {
                console.log("远程图片删除失败，仅清理数据库记录");
            }
            await sb.from("gallery").delete().eq("id", id);
            loadGallery();
        }

        //加载相册
        async function loadGallery() {
            const { data } = await sb.from("gallery").select("*").order("create_at", { asc: false });
            const wrap = document.getElementById("galleryWrap");
            wrap.innerHTML = "";
            if (!data || data.length === 0) {
                wrap.innerHTML = `<div class="col-span-2 text-center text-gray-400 py-10">暂无照片，上传第一张合照吧💖</div>`;
                return;
            }
            data.forEach(item => {
                const div = document.createElement("div");
                div.className = "img-card relative group";
                div.innerHTML = `
            <div class="img-loading absolute inset-0 z-10"><div class="spinner"></div></div>
            <img src="${item.img_url}" class="loading aspect-square rounded-xl object-cover w-full cursor-pointer hover:opacity-90" onclick="openPreview('${item.img_url}')" onload="this.classList.replace('loading','loaded');this.previousElementSibling.style.display='none'">
            <button onclick="deletePhoto('${item.id}','${item.delete_url}')" class="absolute top-2 right-2 bg-red-500 text-white w-7 h-7 rounded-full text-sm flex items-center justify-center shadow-lg opacity-80 hover:opacity-100 z-20">
                <i class="fa fa-trash"></i>
            </button>
        `;
                wrap.appendChild(div);
            })
        }

        //留言
        async function sendMessage() {
            const text = document.getElementById("msgInput").value.trim();
            if (!text) return alert("请输入留言");
            const { data: { user } } = await sb.auth.getUser();
            const username = user?.email || "匿名";
            await sb.from("messages").insert({ content: text, username });
            document.getElementById("msgInput").value = "";
            loadMessages();
        }
        async function loadMessages() {
            const { data } = await sb.from("messages").select("*").order("create_at", { asc: false });
            const wrap = document.getElementById("msgList");
            wrap.innerHTML = "";
            if (!data || data.length === 0) {
                wrap.innerHTML = `<div class="text-center text-gray-400 py-4">还没有留言，写下第一句话吧</div>`;
                return;
            }
            data.forEach(item => {
                const time = new Date(item.create_at).toLocaleString();
                const email = item.username || "";
                let name = email || "匿名";
                if (email === CONFIG.boyEmail) name = CONFIG.boyName;
                else if (email === CONFIG.girlEmail) name = CONFIG.girlName;
                wrap.innerHTML += `
        <div class="bg-rose-50 p-4 rounded-xl">
            <span class="font-bold text-love text-sm">${name}</span>
            <p class="text-gray-700 mt-1">${item.content}</p>
            <span class="text-xs text-gray-400">${time}</span>
        </div>`
            })
        }

        //纪念日
        async function addMemorial() {
            const title = document.getElementById("memoTitle").value.trim();
            const day = document.getElementById("memoDate").value;
            if (!title || !day) return alert("请填写完整");
            await sb.from("memorial_day").insert({ title, day });
            document.getElementById("memoTitle").value = "";
            document.getElementById("memoDate").value = "";
            loadMemorial();
        }
        async function loadMemorial() {
            const { data } = await sb.from("memorial_day").select("*");
            const wrap = document.getElementById("memoList");
            wrap.innerHTML = "";
            if (!data || data.length === 0) {
                wrap.innerHTML = `<li class="text-gray-400 text-center py-4">添加纪念日记录重要日子</li>`;
            }
            data.forEach(item => {
                wrap.innerHTML += `
        <li class="flex justify-between border-b border-rose-100 pb-2">
            <span>${item.title}</span>
            <span>${item.day}</span>
        </li>`
            })
            const start = CONFIG.loveStart;
            const startStr = `${start.getFullYear()}-${String(start.getMonth() + 1).padStart(2, '0')}-${String(start.getDate()).padStart(2, '0')}`;
            wrap.innerHTML = `
        <li class="flex justify-between border-b border-rose-100 pb-2">
            <span>相恋起始日</span>
            <span>${startStr}</span>
        </li>` + wrap.innerHTML;
        }

        //日志
        async function addJournal() {
            const title = document.getElementById("journalTitle").value.trim();
            const content = document.getElementById("journalContent").value.trim();
            const day = document.getElementById("journalDate").value;
            if (!content) return alert("请写下日志内容");
            if (!day) return alert("请选择日期");
            const { data: { user } } = await sb.auth.getUser();
            const username = user?.email || "匿名";
            await sb.from("journal").insert({ title, content, day, username });
            document.getElementById("journalTitle").value = "";
            document.getElementById("journalContent").value = "";
            loadJournal();
        }
        async function loadJournal() {
            const { data } = await sb.from("journal").select("*").order("day", { ascending: false });
            const wrap = document.getElementById("journalList");
            wrap.innerHTML = "";
            if (!data || data.length === 0) {
                wrap.innerHTML = `<div class="text-center text-gray-400 py-4">还没有日志，记录你们的第一篇故事吧💫</div>`;
                return;
            }
            data.forEach(item => {
                const email = item.username || "";
                let name = email || "匿名";
                if (email === CONFIG.boyEmail) name = CONFIG.boyName;
                else if (email === CONFIG.girlEmail) name = CONFIG.girlName;
                const title = item.title || "无标题";
                wrap.innerHTML += `
        <div class="journal-item bg-rose-50 p-4 rounded-xl border-l-4 border-love">
            <div class="flex justify-between items-start mb-2">
                <div>
                    <span class="font-bold text-love">${name}</span>
                    <span class="text-xs text-gray-400 ml-2">${item.day}</span>
                </div>
                <button onclick="deleteJournal('${item.id}')" class="text-gray-400 hover:text-red-500 text-sm">
                    <i class="fa fa-trash"></i>
                </button>
            </div>
            <h3 class="font-semibold text-gray-800 mb-1">${title}</h3>
            <p class="text-gray-600 whitespace-pre-wrap text-sm">${item.content}</p>
        </div>`;
            })
        }
        async function deleteJournal(id) {
            if (!confirm("确定删除这篇日志？")) return;
            await sb.from("journal").delete().eq("id", id);
            loadJournal();
        }

        // ==================== 音乐播放器 ====================
        let musicList = [];
        let currentMusicIndex = -1;

        function toggleMusicPanel() {
            const panel = document.getElementById("musicPanel");
            panel.classList.toggle("hidden-panel");
        }

        async function loadMusicList() {
            const { data } = await sb.from("music").select("*").order("created_at", { ascending: false });
            musicList = data || [];
            const listEl = document.getElementById("musicList");
            listEl.innerHTML = "";
            if (musicList.length === 0) {
                listEl.innerHTML = `<div class="text-center text-gray-400 py-2 text-xs">暂无歌曲，上传一首吧</div>`;
                return;
            }
            musicList.forEach((item, idx) => {
                const div = document.createElement("div");
                div.className = "music-item" + (idx === currentMusicIndex ? " active" : "");
                div.innerHTML = `
                    <span onclick="playMusic(${idx})">${item.title || "未知歌曲"}</span>
                    <span class="del" onclick="deleteMusic('${item.id}')"><i class="fa fa-trash"></i></span>
                `;
                listEl.appendChild(div);
            });
        }

        async function uploadMusic(e) {
            const file = e.target.files[0];
            if (!file) return;
            const title = file.name.replace(/\.[^/.]+$/, "");
            const { data, error } = await sb.storage.from("music").upload(`${Date.now()}_${file.name}`, file);
            if (error) {
                alert("上传失败：" + error.message);
                return;
            }
            const url = sb.storage.from("music").getPublicUrl(data.path).data.publicUrl;
            await sb.from("music").insert({ title, url });
            e.target.value = "";
            loadMusicList();
        }

        async function deleteMusic(id) {
            if (!confirm("确定删除这首歌？")) return;
            await sb.from("music").delete().eq("id", id);
            loadMusicList();
        }

        function playMusic(index) {
            if (index < 0 || index >= musicList.length) return;
            currentMusicIndex = index;
            const item = musicList[index];
            const audio = document.getElementById("musicAudio");
            audio.src = item.url;
            audio.play();
            document.getElementById("musicTitle").innerText = item.title;
            document.getElementById("musicCover").classList.add("playing");
            document.getElementById("musicToggle").classList.add("playing");
            document.getElementById("musicPlayBtn").innerHTML = '<i class="fa fa-pause"></i>';
            loadMusicList();
        }

        function togglePlay() {
            const audio = document.getElementById("musicAudio");
            if (currentMusicIndex === -1) {
                if (musicList.length > 0) playMusic(0);
                return;
            }
            if (audio.paused) {
                audio.play();
                document.getElementById("musicCover").classList.add("playing");
                document.getElementById("musicToggle").classList.add("playing");
                document.getElementById("musicPlayBtn").innerHTML = '<i class="fa fa-pause"></i>';
            } else {
                audio.pause();
                document.getElementById("musicCover").classList.remove("playing");
                document.getElementById("musicToggle").classList.remove("playing");
                document.getElementById("musicPlayBtn").innerHTML = '<i class="fa fa-play"></i>';
            }
        }

        function prevMusic() {
            if (musicList.length === 0) return;
            const idx = currentMusicIndex <= 0 ? musicList.length - 1 : currentMusicIndex - 1;
            playMusic(idx);
        }

        function nextMusic() {
            if (musicList.length === 0) return;
            const idx = currentMusicIndex >= musicList.length - 1 ? 0 : currentMusicIndex + 1;
            playMusic(idx);
        }

        function updateProgress() {
            const audio = document.getElementById("musicAudio");
            if (!audio.duration) return;
            const percent = (audio.currentTime / audio.duration) * 100;
            document.getElementById("musicProgressBar").style.width = percent + "%";
            document.getElementById("musicCurrent").innerText = formatTime(audio.currentTime);
            document.getElementById("musicDuration").innerText = formatTime(audio.duration);
        }

        function seekMusic(e) {
            const audio = document.getElementById("musicAudio");
            if (!audio.duration) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        }

        function onMusicEnded() {
            nextMusic();
        }

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${String(sec).padStart(2, '0')}`;
        }
    </script>
</body>
