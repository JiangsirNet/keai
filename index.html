<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的情侣空间</title>
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b8b">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="情侣空间">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.11/lunar.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        love: '#ff6b8b',
                        loveDark: '#e04c6e'
                    }
                }
            }
        }
    </script>
    <style>
        /* 初始加载样式，防止闪烁 */
        body { font-family: system-ui, -apple-system, sans-serif; background: #fef2f4; margin: 0; }
        #appLoading { display: flex; align-items: center; justify-content: center; height: 100vh; color: #ff6b8b; font-size: 18px; }
    </style>
</head>

<body>
    <div id="appLoading"><i class="fa fa-spinner fa-spin"></i> 加载中...</div>
    <div id="heartBox"></div>

    <!-- 男生 Live2D 风格互动形象 -->
    <div id="boyPet" class="boy-pet hidden" onmousedown="startDragBoy(event)" ontouchstart="startDragBoy(event)">
        <div class="boy-bubble" id="boyBubble"></div>
        <canvas id="boyCanvas" width="240" height="320"></canvas>
    </div>

    <!-- 女生 Live2D 风格互动形象 -->
    <div id="girlPet" class="girl-pet hidden" onmousedown="startDragGirl(event)" ontouchstart="startDragGirl(event)">
        <div class="girl-bubble" id="girlBubble"></div>
        <canvas id="girlCanvas" width="240" height="320"></canvas>
    </div>

    <!-- 猫咪宠物（GIF 动图） -->
    <div id="maoPet" class="mao-pet hidden">
        <div class="mao-bubble" id="maoBubble"></div>
        <img id="maoImg" src="images/猫-待机.gif" alt="猫" />
    </div>

    <!-- 狗宠物（GIF 动图） -->
    <div id="dogPet" class="mao-pet hidden">
        <div class="mao-bubble" id="dogBubble"></div>
        <img id="dogImg" src="images/狗待机.gif" alt="狗" />
    </div>

    <!-- 下拉刷新指示器（微信风格圆形） -->
    <div id="pullRefreshIndicator" class="pull-refresh-indicator">
        <i class="fa fa-refresh" id="pullRefreshIcon"></i>
    </div>

    <!-- 天气组件（左上角）-->
    <div id="weatherWidget" class="weather-widget hidden" onclick="showWeatherDetail()">
        <span class="w-icon" id="wIcon">⏳</span>
        <span class="w-temp" id="wTemp">--</span>
        <span class="w-city" id="wCity">定位中</span>
    </div>

    <!-- 通知铃铛（最右边） -->
    <button id="bellToggle" class="bell-toggle hidden" onclick="toggleBellPanel()">
        <i class="fa fa-bell"></i>
        <span class="bell-badge hidden" id="bellBadge">0</span>
    </button>
    <div id="bellPanel" class="bell-panel hidden">
        <div class="bell-panel-header">
            <span>消息通知</span>
            <button onclick="clearAllNotifications()" class="bell-clear-btn">清空</button>
        </div>
        <div id="bellList" class="bell-list">
            <div class="text-center text-gray-400 py-4 text-xs">暂无通知</div>
        </div>
    </div>
    <audio id="musicAudio" ontimeupdate="updateProgress()" onended="onMusicEnded()"></audio>

    <!-- ===== 以下容器和导航由 loader.js 从数据库动态生成 ===== -->

    <!-- 全局容器（登录面板、弹窗等） -->
    <div id="globalContainers"></div>

    <!-- 主页面 -->
    <div id="mainPage" class="container max-w-4xl mx-auto px-4 py-8 md:py-12 hidden">
        <!-- 导航栏（动态生成） -->
        <nav class="nav-bar" id="navBar"></nav>

        <!-- 页面容器（动态生成） -->
        <div id="pageContainers"></div>

        <div class="text-center mt-10 text-gray-500 text-sm">
            <p>Made with <i class="fa fa-heart text-love"></i> 只属于我们两个人的小天地</p>
        </div>
    </div>

    <!-- 本地核心脚本：config.js（Supabase连接）→ loader.js（从数据库加载其余资源） -->
    <script src="js/config.js"></script>
    <script src="js/loader.js"></script>

    <!-- PWA Service Worker 注册 -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('./sw.js').then(function (reg) {
                    // 强制检查更新，新 SW 立即激活（skipWaiting + clients.claim）
                    reg.update();
                    navigator.serviceWorker.addEventListener('controllerchange', function () {
                        // 新 SW 已接管，无需刷新
                    });
                }).catch(function (e) {
                    console.warn('[PWA] Service Worker 注册失败:', e);
                });
            });
        }
    </script>
</body>

</html>
